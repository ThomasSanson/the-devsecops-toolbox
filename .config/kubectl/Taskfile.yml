---
version: "3"

vars:
  TASK_KUBECTL_ENABLED: '{{.TASK_KUBECTL_ENABLED | default "false"}}'
  TASK_KUBECTL_ANSIBLE_PLAYBOOK_FILE: '{{.TASK_KUBECTL_ANSIBLE_PLAYBOOK_FILE | default ".config/kubectl/playbook.yml"}}'
  TASK_KUBECTL_ANSIBLE_INVENTORY_TARGET: "localhost" # DevSkim: ignore DS162092
  TASK_KUBECTL_VERSION: '{{.TASK_KUBECTL_VERSION | default "v1.32.0"}}'
  TASK_KUBECTL_KUBECONFIG: '{{.TASK_KUBECTL_VERSION | default ""}}'

env:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  LANGUAGE: "C.UTF-8"

tasks:
  install:
    desc: 📥 Install kubectl using Ansible automation
    summary: |
      ℹ️ Description:
        Installs kubectl using Ansible automation

      🔧 Variables:
        - TASK_KUBECTL_ANSIBLE_CMD: Ansible command path
        - TASK_KUBECTL_ANSIBLE_PLAYBOOK_FILE: Ansible playbook location
        - TASK_KUBECTL_VERSION: Version of kubectl to install

      🔐 Preconditions:
        - Dependencies must be installed

      🔄 Execution:
        Runs Ansible playbook for kubectl installation
    status:
      - command -v kubectl &> /dev/null
    preconditions:
      - sh: "test -f {{.TASK_KUBECTL_ANSIBLE_PLAYBOOK_FILE}}"
        msg: "❌ Playbook file not found at {{.TASK_KUBECTL_ANSIBLE_PLAYBOOK_FILE}}"
    cmds:
      - cmd: echo "🔄 Starting kubectl installation phase"
        silent: true
      - |
        {{.TASK_ANSIBLE_COMMAND}} ansible-playbook \
          -i {{.TASK_KUBECTL_ANSIBLE_INVENTORY_TARGET}}, \
          -e "kubectl_version={{.TASK_KUBECTL_VERSION}}" \
          {{.TASK_KUBECTL_ANSIBLE_PLAYBOOK_FILE}}
      - task: cleanup
      - cmd: echo "🎉 Kubectl installation phase completed successfully"
        silent: true

  cleanup:
    desc: 🧹 Remove temporary files and directories
    summary: |
      ℹ️ Description:
        Cleans up temporary files created during installation.
    cmds:
      - cmd: echo "🔄 Starting cleanup phase"
        silent: true
      - cmd: rm -rf {{.TASK_KUBECTL_VENV_DIR}}
        ignore_error: true
      - cmd: echo "🎉 Cleanup phase completed successfully"
        silent: true

  port-forward:
    desc: 🔌 Port-forward a Kubernetes service to localhost
    summary: |
      ℹ️ Description:
        Port-forwards a Kubernetes service to localhost for local access.

      🔧 Variables:
        - SERVICE_NAME: Name of the Kubernetes service
        - LOCAL_PORT: Local port to bind
        - REMOTE_PORT: Remote service port
        - NAMESPACE: Kubernetes namespace (default: default)

      🔄 Execution:
        Stops existing port-forwards and starts a new one in background
    cmds:
      - cmd: echo "🔄 Starting port-forward phase"
        silent: true
      - cmd: echo "🔄 Stopping existing port-forwards..."
        silent: true
      - pkill -f "kubectl.*port-forward.*svc/{{.SERVICE_NAME}}" || true
      - cmd: echo "🔄 Starting port-forward for service '{{.SERVICE_NAME}}'..."
        silent: true
      - bash -c "kubectl --kubeconfig {{.TASK_KUBECTL_KUBECONFIG}} port-forward svc/{{.SERVICE_NAME}} {{.LOCAL_PORT}}:{{.REMOTE_PORT}} -n {{.NAMESPACE | default \"default\"}} > /dev/null 2>&1 &"
      - cmd: echo "🌐 Open http://localhost:{{.LOCAL_PORT}} in your browser" # DevSkim: ignore DS162092
        silent: true
      - cmd: echo "🎉 Port-forward phase completed successfully"
        silent: true

  status:pods:
    desc: 📊 Check status of all pods in all namespaces
    summary: |
      ℹ️ Description:
        Displays the status of all pods across all namespaces.

      🔧 Variables:
        - TASK_KUBECTL_KUBECONFIG: Path to kubeconfig file

      🔄 Execution:
        Runs 'kubectl get pods -A'
    cmds:
      - cmd: echo "🔄 Checking pod status for environment '{{.ENV | default \"testing\"}}'..."
        silent: true
      - kubectl --kubeconfig {{.TASK_KUBECTL_KUBECONFIG}} get pods -A
      - cmd: echo "🎉 Pod status check completed."
        silent: true

  logs:errors:
    desc: 📜 Display logs for pods in Error or CrashLoopBackOff state
    summary: |
      ℹ️ Description:
        Finds pods in Error or CrashLoopBackOff state and displays their logs.

      🔄 Execution:
        Searches for error pods and shows last 50 lines of logs
    cmds:
      - cmd: echo "🔄 Searching for error pods in environment '{{.ENV | default \"testing\"}}'..."
        silent: true
      - |
        PODS=$(kubectl --kubeconfig {{.TASK_KUBECTL_KUBECONFIG}} get pods -A --no-headers | awk '$4 == "Error" || $4 == "CrashLoopBackOff" {print $1 "/" $2}')
        if [ -z "$PODS" ]; then
          echo "✅ No pods in Error or CrashLoopBackOff state found."
        else
          echo "🔥 Error pods found. Displaying logs (last 50 lines):"
          for pod_id in $PODS; do
            namespace=$(echo "$pod_id" | cut -d'/' -f1)
            pod_name=$(echo "$pod_id" | cut -d'/' -f2)
            echo "--- Logs for $pod_id ---"
            kubectl --kubeconfig {{.TASK_KUBECTL_KUBECONFIG}} logs "$pod_name" -n "$namespace" --tail=50 || echo "   (Unable to retrieve logs for $pod_id)"
          done
        fi
      - cmd: echo "🎉 Error pod logs check completed."
        silent: true

  troubleshoot:start:
    desc: 🔍 Start troubleshooting - check general pod status
    summary: |
      ℹ️ Description:
        [Flowchart Step 1] Checks the general status of pods to start troubleshooting.
    cmds:
      - task: status:pods

  troubleshoot:pod:describe:
    desc: 🔎 Show details and events for a specific pod
    summary: |
      ℹ️ Description:
        [Flowchart] Shows details and events for a specific pod.
        Use this if a pod is 'Pending', 'Not Ready', 'ImagePullBackOff', or 'CrashLoopBackOff'.

      📝 Usage:
        task kubectl:troubleshoot:pod:describe -- <pod-name> [-n <namespace>]
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "❌ Error: Pod name missing. Usage: task kubectl:troubleshoot:pod:describe -- <pod-name> [-n <namespace>]"
          exit 1
        fi
        echo "🔍 Displaying details for pod '{{.CLI_ARGS}}' in environment '{{.ENV | default \"testing\"}}'..."
        kubectl --kubeconfig {{.TASK_KUBECTL_KUBECONFIG}} describe pod {{.CLI_ARGS}}

  troubleshoot:pod:logs:
    desc: 📋 Show current logs for a specific pod
    summary: |
      ℹ️ Description:
        [Flowchart] Shows current logs for a specific pod.
        Use this if a pod is 'Running' but the application has issues.

      📝 Usage:
        task kubectl:troubleshoot:pod:logs -- <pod-name> [-n <namespace>] [--tail=N]
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "❌ Error: Pod name missing. Usage: task kubectl:troubleshoot:pod:logs -- <pod-name> [-n <namespace>]"
          exit 1
        fi
        echo "📜 Displaying logs for pod '{{.CLI_ARGS}}' in environment '{{.ENV | default \"testing\"}}'..."
        kubectl --kubeconfig {{.TASK_KUBECTL_KUBECONFIG}} logs {{.CLI_ARGS}}

  troubleshoot:pod:logs:previous:
    desc: 📜 Show logs from the previous container instance
    summary: |
      ℹ️ Description:
        [Flowchart] Shows logs from the previous container (if it restarted/crashed).

      📝 Usage:
        task kubectl:troubleshoot:pod:logs:previous -- <pod-name> [-n <namespace>]
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "❌ Error: Pod name missing. Usage: task kubectl:troubleshoot:pod:logs:previous -- <pod-name> [-n <namespace>]"
          exit 1
        fi
        echo "📜 Displaying previous logs for pod '{{.CLI_ARGS}}' in environment '{{.ENV | default \"testing\"}}'..."
        kubectl --kubeconfig {{.TASK_KUBECTL_KUBECONFIG}} logs --previous {{.CLI_ARGS}}

  troubleshoot:pods:node:
    desc: 🗺️ Check which nodes the pods are assigned to
    summary: |
      ℹ️ Description:
        [Flowchart] Checks which nodes the pods are assigned to.
    cmds:
      - echo "🗺️  Checking pod assignment to nodes for environment '{{.ENV | default \"testing\"}}'..."
      - kubectl --kubeconfig {{.TASK_KUBECTL_KUBECONFIG}} get pods -A -o wide

  troubleshoot:pods:describe:problems:
    desc: 🚨 Describe all pods that are NOT Running or Completed
    summary: |
      ℹ️ Description:
        [Flowchart] Automatically describes ALL pods that are NOT 'Running' or 'Completed'.
    cmds:
      - cmd: echo "🔄 Searching for unhealthy pods ('Pending', 'Error', 'CrashLoop...', '0/X Ready', etc.) for environment '{{.ENV | default \"testing\"}}'..."
        silent: true
      - |
        KUBECONFIG_PATH="{{.TASK_KUBECTL_KUBECONFIG}}"
        # Ensure the path is canonical
        # KUBECONFIG_PATH=$(realpath "$KUBECONFIG_PATH") # Reverted this change

        PROBLEMATIC_PODS=$(kubectl --kubeconfig "$KUBECONFIG_PATH" get pods -A --no-headers | awk '$4 != "Running" && $4 != "Completed" {print $1 "/" $2}')
        if [ -z "$PROBLEMATIC_PODS" ]; then
          echo "✅ No pods in an unhealthy state found."
        else
          echo "🔥 Unhealthy pods found. Displaying details ('describe') for each:"
          for pod_id in $PROBLEMATIC_PODS; do
            namespace=$(echo "$pod_id" | cut -d'/' -f1)
            pod_name=$(echo "$pod_id" | cut -d'/' -f2)
            echo "--- Describe for $pod_id ---"
            kubectl --kubeconfig "$KUBECONFIG_PATH" describe pod "$pod_name" -n "$namespace"
            echo "---------------------------"
          done
        fi
      - cmd: echo "🎉 Unhealthy pods check completed."
        silent: true

  debug:
    desc: 🐛 Run a sequence of troubleshooting tasks for pods
    summary: |
      ℹ️ Description:
        Runs a complete troubleshooting sequence for Kubernetes pods.

      🔄 Execution:
        1. Check general pod status
        2. Describe unhealthy pods
        3. Show error pod logs
        4. Check pod-to-node assignment
    cmds:
      - cmd: echo "== Step 1 General Pod Status =="
        silent: true
      - task: troubleshoot:start
      - cmd: echo "\n== Step 2 Description of Unhealthy Pods =="
        silent: true
      - task: troubleshoot:pods:describe:problems
      - cmd: echo "\n== Step 3 Logs of Error Pods =="
        silent: true
      - task: logs:errors
      - cmd: echo "\n== Step 4 Pod Assignment to Nodes =="
        silent: true
      - task: troubleshoot:pods:node
      - cmd: echo "\n🏁 Pod debugging sequence completed."
        silent: true
