---
version: "3"

vars:
  TASK_LEFTHOOK_ENABLED: '{{.TASK_LEFTHOOK_ENABLED | default "true"}}'
  TASK_LEFTHOOK_VERSION: '{{.TASK_LEFTHOOK_VERSION | default "v1.11.11"}}' # Specify Lefthook version
  TASK_LEFTHOOK_BIN_PATH: '{{.TASK_LEFTHOOK_BIN_PATH | default "~/go/bin/lefthook"}}' # Path where go install places binaries

tasks:
  lefthook:install:
    desc: 🪝 Install and configure Lefthook Git hooks
    summary: |
      ℹ️ Description:
        Installs Lefthook and configures Git hooks for the repository.

      🔧 Variables:
        - TASK_LEFTHOOK_BIN_PATH: Path to the Lefthook binary

      🔐 Preconditions:
        - Must be in a Git repository
        - Lefthook must be installed (runs install task first)

      🔄 Execution:
        Runs 'lefthook install' to set up Git hooks
    deps: ["install"]
    cmds:
      - cmd: echo "🔄 Starting lefthook:install phase"
        silent: true
      - |
        # Check if we are in a Git repository
        if git rev-parse --is-inside-work-tree &>/dev/null; then
          {{.TASK_LEFTHOOK_BIN_PATH}} install
        else
          # Skip if not in a Git repository
          echo "⏩ Skipping Lefthook installation - not in a Git repository"
        fi
      - cmd: echo "🎉 Lefthook:install phase completed successfully"
        silent: true

  install:
    desc: 📥 Install Lefthook using Go
    summary: |
      ℹ️ Description:
        Installs Lefthook globally using Go.

      🔧 Variables:
        - TASK_LEFTHOOK_VERSION: Version of Lefthook to install.
        - TASK_LEFTHOOK_BIN_PATH: Expected path to the Lefthook binary.

      🔐 Preconditions:
        - Go must be installed and configured (GOPATH/bin in PATH).

      🔄 Execution:
        Runs 'go install' to fetch and build Lefthook.
    status:
      - command -v lefthook &> /dev/null
    preconditions:
      - sh: "command -v go >/dev/null 2>&1"
        msg: "❌ Go is not installed or not in PATH"
    cmds:
      - cmd: echo "🔄 Starting install phase"
        silent: true
      - go install github.com/evilmartians/lefthook@{{.TASK_LEFTHOOK_VERSION}}
      - cmd: echo "✅ Lefthook {{.TASK_LEFTHOOK_VERSION}} installed successfully at {{.TASK_LEFTHOOK_BIN_PATH}}"
        silent: true
      - cmd: echo "🎉 Install phase completed successfully"
        silent: true
