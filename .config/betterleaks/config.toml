title = "Betterleaks Configuration"

# Extend the default configuration
[extend]
useDefault = true

# Global configuration to ignore specific files
[allowlist]
description = "Files to ignore for secrets detection"
paths = [
  # Encrypted at rest (Sealed Secrets): safe to commit.
  '''.*/sealed-secrets\.yaml''',
  # Placeholder env files ONLY (no real values). A real `.env`, `.env.dist`,
  # `.env.dev` or `secrets.yaml` is exactly where a live secret lands, so the
  # scanner must read those (see issue #182). Never widen this back to `.*\.env`.
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.template$''',
  # Build/cache/vendor trees: no first-party source to scan.
  '''(^|/)\.cache/''',
  '''(^|/)tmp/''',
  # Test-run artifacts (install logs, diagnostics, screenshots): throwaway
  # tokens from the disposable GitLab the suite boots, in untracked files.
  '''(^|/)_output/''',
  '''(^|/)\.diagnostics/''',
  '''(^|/)megalinter-reports/''',
  '''(^|/)node_modules/''',
  '''(^|/)venv/'''
]
# The fake credentials the publication story plants on purpose: its whole point
# is that the scanner catches them BEFORE they become public, so the scanner has
# to tolerate them here. Matched on the value, not on the file: a fixture is
# still a file that must be read.
regexes = [
  '''Zt7kQ2mV9pL4xR8w'''
]
