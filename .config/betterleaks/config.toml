title = "Betterleaks Configuration"

# Extend the default configuration
#
# Never point `[extend] path` at this file. MegaLinter already wraps it in a
# config of its own that extends it, and betterleaks follows two extends at
# most, without a warning. MegaLinter's config -> a project file -> this file
# is already two, so the default rules this file asks for are never loaded:
# the scan finds nothing and passes (issue #228). A project that needs paths
# of its own copies this file whole, `useDefault = true` included, adds them
# to the copy, and points TASK_BETTERLEAKS_CONFIG (.env.dist) and
# REPOSITORY_BETTERLEAKS_CONFIG_FILE (.config/megalinter/config.yml) at it.
[extend]
useDefault = true

# The default rules catch a token assigned to a name such as apiKey, but not
# the same token written into an HTTP Authorization header, after Bearer or on
# its own: the shape every fetch or axios call uses (issue #157). Only a run of
# 20 or more token characters with enough entropy counts, so a template such as
# `Bearer ${token}` or a placeholder such as <token> does not.
[[rules]]
id = "bearer-token-hardcoded"
description = "A token written into an HTTP Authorization header"
regex = '''(?i)(?:authorization|bearer)["'\s:=]+(?:bearer\s+)?([a-z0-9\-_.~+/]{20,}=*)'''
secretGroup = 1
entropy = 3.5
keywords = ["bearer", "authorization"]

# Global configuration to ignore specific files
[allowlist]
description = "Files to ignore for secrets detection"
paths = [
  # Encrypted at rest (Sealed Secrets): safe to commit.
  '''.*/sealed-secrets\.yaml''',
  # Placeholder env files ONLY (no real values). A real `.env`, `.env.dist`,
  # `.env.dev` or `secrets.yaml` is exactly where a live secret lands, so the
  # scanner must read those (see issue #182). Never widen this back to `.*\.env`.
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.template$''',
  # Build/cache/vendor trees: no first-party source to scan.
  '''(^|/)\.cache/''',
  '''(^|/)tmp/''',
  # Test-run artifacts (install logs, diagnostics, screenshots): throwaway
  # tokens from the disposable GitLab the suite boots, in untracked files.
  '''(^|/)_output/''',
  '''(^|/)\.diagnostics/''',
  '''(^|/)megalinter-reports/''',
  '''(^|/)node_modules/''',
  '''(^|/)vendor/''',
  '''(^|/)venv/''',
  # The publication story plants fake credentials on purpose: its whole point is
  # that the scan catches them before they become public. The file that CARRIES
  # the fixture is skipped here — never the value, because the value has to stay
  # detectable for the story to prove anything.
  '''(^|/)project/tests/e2e/support/steps/source-publication\.js$'''
]
