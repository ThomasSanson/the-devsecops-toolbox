---
version: "3"

# Note: This is a test to ensure that the tool functions correctly and is mastered before being fully integrated into the project.

vars:
  TASK_DEPENDENCY_CHECK_USER: '{{.TASK_DEPENDENCY_CHECK_USER | default ""}}'
  TASK_DEPENDENCY_CHECK_VERSION: "latest"
  TASK_DEPENDENCY_CHECK_DIRECTORY: "{{.HOME}}/OWASP-Dependency-Check"
  TASK_DEPENDENCY_CHECK_PROJECT: "dependency-check scan: {{.PWD}}"
  TASK_DEPENDENCY_CHECK_DATA_DIRECTORY: "{{.TASK_DEPENDENCY_CHECK_DIRECTORY}}/data"
  TASK_DEPENDENCY_CHECK_CACHE_DIRECTORY: "{{.TASK_DEPENDENCY_CHECK_DIRECTORY}}/data/cache"
  TASK_DEPENDENCY_CHECK_REPORT_DIRECTORY: "{{.PWD}}/odc-reports"

tasks:
  setup:
    desc: 📁 Prepare directories for Dependency-Check
    summary: |
      ℹ️ Description:
        Creates the necessary directories for Dependency-Check data, cache, and reports.

      🔧 Variables:
        - TASK_DEPENDENCY_CHECK_DATA_DIRECTORY: Directory for vulnerability database
        - TASK_DEPENDENCY_CHECK_CACHE_DIRECTORY: Directory for cache files
        - TASK_DEPENDENCY_CHECK_REPORT_DIRECTORY: Directory for generated reports

      🔄 Execution:
        Creates three directories: data, cache, and reports
    cmds:
      - cmd: echo "🔄 Preparing directories for Dependency-Check"
        silent: true
      - mkdir -p {{.TASK_DEPENDENCY_CHECK_DATA_DIRECTORY}}
      - mkdir -p {{.TASK_DEPENDENCY_CHECK_CACHE_DIRECTORY}}
      - mkdir -p {{.TASK_DEPENDENCY_CHECK_REPORT_DIRECTORY}}
      - cmd: echo '🎉 Directories prepared for Dependency-Check.'
        silent: true

  pull:
    desc: 🐳 Download latest Dependency-Check Docker image
    summary: |
      ℹ️ Description:
        Pulls the latest OWASP Dependency-Check Docker image from Docker Hub.

      🔧 Variables:
        - TASK_DEPENDENCY_CHECK_VERSION: Docker image tag (default: latest)

      🔄 Execution:
        Runs 'docker pull owasp/dependency-check:<version>'
    cmds:
      - cmd: echo "🔄 Downloading latest Dependency-Check Docker image"
        silent: true
      - docker pull owasp/dependency-check:{{.TASK_DEPENDENCY_CHECK_VERSION}}
      - cmd: echo '🎉 Dependency-Check Docker image downloaded.'
        silent: true

  analyze:
    desc: 🔍 Run Dependency-Check analysis
    summary: |
      ℹ️ Description:
        Runs OWASP Dependency-Check to scan project dependencies for known vulnerabilities.

      🔧 Variables:
        - TASK_DEPENDENCY_CHECK_USER: User ID for Docker container
        - TASK_DEPENDENCY_CHECK_PROJECT: Project name for reports
        - TASK_DEPENDENCY_CHECK_REPORT_DIRECTORY: Output directory for reports

      🔐 Preconditions:
        - Docker must be installed and running
        - setup and pull tasks must complete first

      🔄 Execution:
        Runs Dependency-Check in Docker container, scanning /project and outputting to /report
    deps: [setup, pull]
    cmds:
      - cmd: echo "🔄 Running Dependency-Check analysis"
        silent: true
      - |
        docker run --rm \
          -e user={{.TASK_DEPENDENCY_CHECK_USER}} \
          --volume {{.PWD}}:/project:z \
          --volume {{.TASK_DEPENDENCY_CHECK_DATA_DIRECTORY}}:/usr/share/dependency-check/data:z \
          --volume {{.TASK_DEPENDENCY_CHECK_REPORT_DIRECTORY}}:/report:z \
          owasp/dependency-check:{{.TASK_DEPENDENCY_CHECK_VERSION}} \
          --scan /project \
          --format "ALL" \
          --project "{{.TASK_DEPENDENCY_CHECK_PROJECT}}" \
          --out /report
      - cmd: echo '🎉 Dependency-Check analysis completed. Reports available in {{.TASK_DEPENDENCY_CHECK_REPORT_DIRECTORY}}'
        silent: true

  clean:
    desc: 🧹 Remove Dependency-Check data and reports
    summary: |
      ℹ️ Description:
        Removes all Dependency-Check data, cache, and report directories.

      ⚠️ Warning:
        This will delete the vulnerability database which may take time to rebuild.

      🔄 Execution:
        Removes TASK_DEPENDENCY_CHECK_DIRECTORY and TASK_DEPENDENCY_CHECK_REPORT_DIRECTORY
    cmds:
      - cmd: echo "🔄 Cleaning up Dependency-Check data and reports"
        silent: true
      - rm -rf {{.TASK_DEPENDENCY_CHECK_DIRECTORY}}
      - rm -rf {{.TASK_DEPENDENCY_CHECK_REPORT_DIRECTORY}}
      - cmd: echo '🎉 Dependency-Check data and reports removed.'
        silent: true

  update:
    desc: 🔄 Update Dependency-Check Docker image
    summary: |
      ℹ️ Description:
        Updates the Dependency-Check Docker image to the latest version.

      🔄 Execution:
        Calls the pull task to download the latest image
    cmds:
      - cmd: echo "🔄 Updating Dependency-Check Docker image"
        silent: true
      - task: pull
      - cmd: echo '🎉 Dependency-Check Docker image updated.'
        silent: true
