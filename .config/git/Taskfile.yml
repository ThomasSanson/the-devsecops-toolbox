version: "3"

vars:
  TASK_GIT_CONFIG_DIR: .config/git

tasks:
  clean-secrets:
    desc: "🧹 Clean exposed secrets from Git history (DESTRUCTIVE)"
    summary: |
      Removes a file from entire Git history.
      ⚠️  WARNING: Destructive operation that rewrites history!

      Usage: task git:clean-secrets -- <path/to/file>
      Example: task git:clean-secrets -- project/datawarehouse-db/sql/init_postgres_fdw.sql
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "❌ Error: No file specified"
          echo "Usage: task git:clean-secrets -- <path/to/file>"
          exit 1
        fi
        bash {{.TASK_GIT_CONFIG_DIR}}/clean-secrets.sh {{.CLI_ARGS}}

  install:
    desc: "📦 Install Git"
    summary: |
      Installs Git on the system.
      Useful for devcontainers or CI environments where Git might be missing.
    status:
      - command -v git >/dev/null 2>&1
    cmds:
      - bash {{.TASK_GIT_CONFIG_DIR}}/install.sh

  install:sudo:
    desc: "📦 Install Git with sudo"
    preconditions:
      - sh: command -v sudo >/dev/null 2>&1
        msg: |
          ❌ sudo is not available.
          Install git manually, then rerun:
            task devsecops:init
    status:
      - command -v git >/dev/null 2>&1
    cmds:
      - cmd: echo "📦 Installing git with sudo..."
        silent: true
      - cmd: sudo bash {{.TASK_GIT_CONFIG_DIR}}/install.sh
        silent: false
