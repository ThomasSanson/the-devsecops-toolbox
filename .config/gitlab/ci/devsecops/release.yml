---
release:
  stage: release
  needs: [] # Allows parallel execution
  # Only one release may touch the branch-protection state at a time: two
  # concurrent releases would race on opening/closing push access to the
  # default branch.
  resource_group: release
  extends: .docker-job
  variables:
    # Variables for Docker (likely used within 'task release')
    TASK_DOCKER_CE_AUTH_ENABLED: "true"
    TASK_DOCKER_CE_IMAGE_NAME: ${CI_REGISTRY_IMAGE}
    TASK_DOCKER_CE_PUSH: "true"
    TASK_DOCKER_CE_REGISTRY_PASSWORD: ${CI_REGISTRY_PASSWORD}
    TASK_DOCKER_CE_REGISTRY_URL: ${CI_REGISTRY}
    TASK_DOCKER_CE_REGISTRY_USERNAME: ${CI_REGISTRY_USER}
  script:
    - task release
  after_script:
    # No `|| true`: a failed re-lock must be visible in the job log, not
    # swallowed into a green run. The authoritative gate is the EXIT/INT/TERM/HUP
    # trap inside `task release`, which fails the job if the door cannot be shut.
    - task glab:release:lock-default-branch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ALL_SCHEDULE == "1"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_RELEASE_SCHEDULE == "1"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^staging$/
      when: never
    # Run in all other cases (MRs, feature branches, etc.)
    - when: always
