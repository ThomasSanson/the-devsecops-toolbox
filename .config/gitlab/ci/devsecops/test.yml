---
# The Taskfile is the single orchestrator: `task test` runs the coverage guards
# (check:build-coverage, check:test-coverage) and then the full project suite
# (project:test -> tdd -> deploy + project:test:e2e). CI therefore owns no
# per-suite job — it just triggers the umbrella, exactly like the generated
# projects' pipeline (test.yml.jinja).
test:
  stage: test
  needs: [] # Allows parallel execution
  extends: .default-tags
  retry: 1
  # Explicit ceiling, sized from a measured CI run: image builds + GitLab CE
  # boot + the full e2e suite with in-scenario retries needed >45m on the
  # 4-vCPU SaaS runner (a 45m cap killed an otherwise progressing run).
  # retry:1 still bounds the worst case to two attempts.
  timeout: 90m
  variables:
    # 2 workers in CI (3 locally): the 4-vCPU SaaS runner also hosts the
    # GitLab CE instance, Chromium and the scenario containers; at 3 workers
    # the contention starves GitLab CE into 500s and setup timeouts.
    TASK_E2E_WORKERS: "2"
  script:
    - task test
  artifacts:
    # `always`, not `on_failure`: a green run regenerates the signature
    # storyboard SVGs and used to throw them away. Publishing them makes the
    # visual deliverable reviewable straight from the MR widget (expose_as).
    when: always
    expose_as: "Storyboards"
    paths:
      # Green boards (the deliverable) + everything needed to debug a red run:
      # failure storyboards and logs (_output), pixel diffs (screenshots/diff),
      # and infra dumps (.diagnostics). The last three are empty on a green run
      # (GitLab just warns, the job stays green).
      - project/tests/e2e/storyboards
      - project/tests/e2e/_output
      - project/tests/e2e/screenshots/diff
      - .diagnostics
    reports:
      # One JUnit XML per worker (see project/tests/e2e/support/junit-reporter.js)
      # feeds the MR "Test summary" widget.
      junit:
        - project/tests/e2e/_output/junit/*.xml
    expire_in: 3 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ALL_SCHEDULE == "1"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_TEST_SCHEDULE == "1"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^staging$/
      when: never
    # Do not execute default jobs on the main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    # Run in all other cases (MRs, feature branches, etc.)
    - when: always

# Storyboard gallery — publishes the signature visual deliverable on every
# pipeline. Reads the committed SVGs straight from the checkout (byte-identical
# to a fresh render at tolerance:0), so it needs neither the heavy e2e job nor a
# runner. On the default branch GitLab serves it as Pages; on an MR the
# `public/` artifact is linked in the widget via expose_as.
pages:
  stage: deploy
  needs: []
  extends: .default-tags
  script:
    - mkdir -p public/storyboards
    - cp -r project/tests/e2e/storyboards/. public/storyboards/
    - |
      {
        echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
        echo '<title>DevSecOps Toolbox — storyboards</title>'
        echo '<style>body{font-family:sans-serif;margin:2rem;max-width:1100px}'
        echo 'h2{margin-top:2.5rem;border-bottom:1px solid #ccc}'
        echo 'img{width:100%;height:auto;border:1px solid #eee;margin:.5rem 0}</style>'
        echo '</head><body><h1>DevSecOps Toolbox — storyboards</h1>'
        find public/storyboards -name '*.svg' | sort | while read -r f; do
          rel="${f#public/}"
          echo "<h2>${rel#storyboards/}</h2><img src=\"$rel\" alt=\"$rel\">"
        done
        echo '</body></html>'
      } > public/index.html
  artifacts:
    paths:
      - public
    expose_as: "Storyboard gallery"
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^staging$/
      when: never
    - when: always
