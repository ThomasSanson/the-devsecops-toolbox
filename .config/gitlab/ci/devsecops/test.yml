---
.test-rules: &test_rules
  retry: 1
  artifacts:
    when: on_failure
    paths:
      - .diagnostics
      - project
    expire_in: 3 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ALL_SCHEDULE == "1"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_TEST_SCHEDULE == "1"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^staging$/
      when: never
    # Do not execute default jobs on the main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    # Run in all other cases (MRs, feature branches, etc.)
    - when: always

test:build-coverage:
  stage: test
  needs: []
  extends: .default-tags
  script:
    - task devsecops:test:check:build-coverage
  <<: *test_rules

test:check-test-coverage:
  stage: test
  needs: []
  extends: .default-tags
  script:
    - task devsecops:test:check:test-coverage
  <<: *test_rules

test:template:
  stage: test
  needs: []
  extends: .default-tags
  script:
    - task project:test:template
  <<: *test_rules

test:gitlab:
  stage: test
  needs: []
  extends: .default-tags
  script:
    - task project:test:clean
    - task deploy
    - task project:test:gitlab
  <<: *test_rules
