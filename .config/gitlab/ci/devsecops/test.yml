---
# The Taskfile is the single orchestrator: `task test` runs the coverage guards
# (check:build-coverage, check:test-coverage) and then the full project suite
# (project:test -> tdd -> deploy + project:test:e2e). CI therefore owns no
# per-suite job — it just triggers the umbrella, exactly like the generated
# projects' pipeline (test.yml.jinja).
test:
  stage: test
  needs: [] # Allows parallel execution
  extends: .docker-job
  retry: 1
  # The suite is sharded: each of the 9 parallel jobs boots its own full test
  # environment (GitLab CE, Chromium, scenario containers) and runs only the
  # scenarios its entry in project/tests/e2e/shards.json selects. Sharding is
  # what keeps every job under the wall-clock target AND gives each one the
  # whole runner's RAM/CPU (one shared 4-vCPU runner running the full suite
  # starved GitLab CE and the browser into OOM kills and 500s).
  # check:shard-coverage (task test guard) proves every scenario lands in
  # exactly one shard.
  parallel: 9
  # Per-shard ceiling: setup (~6m cold) + the heaviest shard (~7m of
  # scenarios) + in-scenario retries. retry:1 bounds the worst case.
  timeout: 45m
  variables:
    # 2 workers per shard: enough to overlap a shard's scenarios while
    # leaving GitLab CE and Chromium their share of the runner.
    TASK_E2E_WORKERS: "2"
  script:
    - export TASK_CODECEPTJS_FEATURES="$(jq -re --arg i "$CI_NODE_INDEX" '.[$i]' project/tests/e2e/shards.json)"
    - echo "🔀 Shard $CI_NODE_INDEX/$CI_NODE_TOTAL → $TASK_CODECEPTJS_FEATURES"
    - task test
  artifacts:
    # `always`, not `on_failure`: a green run regenerates the signature
    # storyboard SVGs and used to throw them away. Publishing them makes the
    # visual deliverable reviewable straight from the MR widget (expose_as).
    when: always
    expose_as: "Storyboards"
    paths:
      # Green boards (the deliverable) + everything needed to debug a red run:
      # failure storyboards and logs (_output), pixel diffs (screenshots/diff),
      # and infra dumps (.diagnostics). The last three are empty on a green run
      # (GitLab just warns, the job stays green).
      - project/tests/e2e/storyboards
      - project/tests/e2e/_output
      - project/tests/e2e/screenshots/diff
      - .diagnostics
    reports:
      # One JUnit XML per worker (see project/tests/e2e/support/junit-reporter.js)
      # feeds the MR "Test summary" widget.
      junit:
        - project/tests/e2e/_output/junit/*.xml
    expire_in: 3 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ALL_SCHEDULE == "1"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_TEST_SCHEDULE == "1"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^staging$/
      when: never
    # Do not execute default jobs on the main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    # Run in all other cases (MRs, feature branches, etc.)
    - when: always

# The key principle of this repo: every product change is proven by a VISIBLE
# storyboard card. This gate makes it mechanical — on a merge request it FAILS
# when product files (.config/**, copier.yml, Taskfile.yml{,.jinja}) changed
# with no storyboard card changed or added. A `Storyboard-exempt: <reason>`
# commit trailer is the only, visible waiver. The gate is only meaningful on MR
# pipelines, where CI_MERGE_REQUEST_DIFF_BASE_SHA gives the exact diff base
# (GIT_DEPTH: 0 → that base commit is always in the clone). Its own red→green
# behaviour is proven visually by the @test-discipline storyboard
# (project/tests/e2e/features/03-evolution/test-discipline.feature).
storyboard-coverage:
  stage: test
  needs: [] # Parallel, fast (~seconds): a git diff, no environment to boot.
  extends: .native-job
  # The guard needs only git + bash, both in the base image — skip the heavy
  # curl/task/dev:init:ci bootstrap so an unrelated setup hiccup can't mask it.
  before_script: []
  script:
    # BASE defaults to CI_MERGE_REQUEST_DIFF_BASE_SHA inside the script.
    - bash .config/devsecops/scripts/check-storyboard-coverage.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# A test suite has one job: to fail when the code is wrong. The cheapest way to
# make a red pipeline green is not to fix the code — it is to switch the test
# off. This gate reads the lines the merge request ADDS and FAILS on the ones
# that do it (a skipped or exclusive scenario, a raised visual tolerance,
# `allow_failure: true`, a linter silenced inside the tests). A
# `No-cheat-exempt: <reason>` commit trailer is the only, visible waiver.
# Twin of `storyboard-coverage`: same diff base, same refusal to pass when the
# diff cannot be computed (.config/devsecops/scripts/diff-base.sh). Its own
# red→green behaviour is proven visually by the @test-discipline storyboard
# (project/tests/e2e/features/03-evolution/test-discipline.feature).
no-cheat:
  stage: test
  needs: [] # Parallel, fast (~seconds): a git diff, no environment to boot.
  extends: .native-job
  # The guard needs only git + bash, both in the base image — skip the heavy
  # curl/task/dev:init:ci bootstrap so an unrelated setup hiccup can't mask it.
  before_script: []
  script:
    # BASE defaults to CI_MERGE_REQUEST_DIFF_BASE_SHA inside the script.
    - bash .config/devsecops/scripts/check-no-cheat.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
