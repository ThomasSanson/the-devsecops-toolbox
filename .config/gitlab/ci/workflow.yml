---
# A new push on a merge request cancels the previous pipeline of that merge
# request. Other pipelines (default branch, tags, web, schedules) never get
# cancelled, so a release or a deployment is never cut in the middle.
default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: none
  rules:
    # Rule 1: Highest priority. Always run a pipeline for the 'staging' tag,
    # regardless of the commit message.
    - if: '$CI_COMMIT_TAG == "staging"'
      when: always

    # Precedence: permit non-push sources first to ensure they are not blocked by exclusion rules below.
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: always
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: always

    # Rule 2: If the pipeline is for a branch (not a tag) AND the commit message
    # starts with "build: bump version", explicitly prevent a pipeline from running.
    # Restrict to push pipelines only to avoid blocking scheduled or manual (web) pipelines.
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /^build: bump version/'
      when: never

    # Rule 3: Default catch-all for normal development.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      auto_cancel:
        on_new_commit: interruptible
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
