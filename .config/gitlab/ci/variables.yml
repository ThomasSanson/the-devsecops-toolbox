---
# GitLab decides from the synchronized project variable before any runner starts.
# Fixed controls always retain the full pipeline, even under an allowed parent.
.deployment-only:
  rules:
    - if: &deployment_paths_configured '$CI_PIPELINE_SOURCE == "merge_request_event" && $TASK_DEVSECOPS_DEPLOY_ONLY_REGEXP'
      changes: &protected_deployment_paths
        regexp: '\A(?:\.env[^/]*|copier\.ya?ml|\.gitlab-ci\.ya?ml)\z|(?:\A|/)(?:Taskfile\.ya?ml|(?:AGENTS|CLAUDE)\.md)\z|(?:\A|/)(?:\.(?:config|git|agents|claude|codex)|tests?|specs?)(?:/|\z)|(?:\A|/)(?:test_|spec_)|[._](?:test|spec)\.[^/]*\z'
      when: always
    - if: *deployment_paths_configured
      changes: &outside_deployment_paths
        regexp: $TASK_DEVSECOPS_DEPLOY_ONLY_REGEXP
      when: always
    - if: *deployment_paths_configured
      when: never

.deployment-only-megalinter:
  rules:
    - if: *deployment_paths_configured
      changes: *protected_deployment_paths
      when: always
    - if: *deployment_paths_configured
      changes: *outside_deployment_paths
      when: always
    - if: *deployment_paths_configured
      when: always
      variables:
        VALIDATE_ALL_CODEBASE: "false"
        DEFAULT_BRANCH: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
        # File modes need explicit selectors: repository descriptors have none.
        # Grype/Syft reuse their first file target in this image; keep project mode.
        REPOSITORY_CHECKOV_CLI_LINT_MODE: list_of_files
        REPOSITORY_CHECKOV_FILE_EXTENSIONS: "*"
        REPOSITORY_DEVSKIM_CLI_LINT_MODE: list_of_files
        REPOSITORY_DEVSKIM_FILE_EXTENSIONS: "*"
        REPOSITORY_BETTERLEAKS_CLI_LINT_MODE: list_of_files
        REPOSITORY_BETTERLEAKS_FILE_EXTENSIONS: "*"
        REPOSITORY_LS_LINT_CLI_LINT_MODE: list_of_files
        REPOSITORY_LS_LINT_FILE_EXTENSIONS: "*"
        REPOSITORY_OSV_SCANNER_CLI_LINT_MODE: list_of_files
        REPOSITORY_OSV_SCANNER_FILE_EXTENSIONS: "*"
        REPOSITORY_SECRETLINT_CLI_LINT_MODE: list_of_files
        REPOSITORY_SECRETLINT_FILE_EXTENSIONS: "*"
        REPOSITORY_SEMGREP_CLI_LINT_MODE: list_of_files
        REPOSITORY_SEMGREP_FILE_EXTENSIONS: "*"
        REPOSITORY_TRIVY_CLI_LINT_MODE: file
        REPOSITORY_TRIVY_FILE_EXTENSIONS: "*"
        REPOSITORY_TRIVY_SBOM_CLI_LINT_MODE: file
        REPOSITORY_TRIVY_SBOM_FILE_EXTENSIONS: "*"
        REPOSITORY_TRUFFLEHOG_CLI_LINT_MODE: list_of_files
        REPOSITORY_TRUFFLEHOG_FILE_EXTENSIONS: "*"
        REPOSITORY_KINGFISHER_CLI_LINT_MODE: list_of_files
        REPOSITORY_KINGFISHER_FILE_EXTENSIONS: "*"
        # Checks that require the whole project belong to the full pipeline.
        SKIP_CLI_LINT_MODES: project

variables:
  # Terminal and color settings
  TERM: xterm
  FORCE_COLOR: "1" # Force color output for tools supporting this standard (npm, npx, Python 3.13+, etc.)
  PYTHON_COLORS: "1" # Force color for Python interpreter (takes precedence over FORCE_COLOR)
  NPM_CONFIG_COLOR: "always" # Force color for npm/npx specifically

  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  CZ_ALLOW_PUSH: "true"
  # Variables for the init Taskfile
  TASK_DEV_INIT_PROJECT_DIR: $CI_PROJECT_DIR
  # TASK_DEV_INIT_OWNER: 'developer:developer' # Default is handled in Taskfile
  TASK_DEV_INIT_GIT_SERVER_HOST: $CI_SERVER_HOST
  TASK_DEV_INIT_GIT_USER_NAME: $GITLAB_USER_LOGIN
  TASK_DEV_INIT_GIT_USER_EMAIL: $GITLAB_USER_EMAIL
  TASK_CODECEPTJS_CI: "true"
  TASK_CODECEPTJS_RUNNER: "codeceptjs"
  TASK_RENOVATE_REPOSITORY: $CI_PROJECT_PATH
  TASK_RENOVATE_PLATFORM: "gitlab"

  # Variables for commitizen bump (likely used within 'task release')
  TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH: $CI_COMMIT_BRANCH
  TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH: $CI_DEFAULT_BRANCH
  # Variables for push-release task
  TASK_DEVSECOPS_RELEASE_ALLOW_PUSH: $CZ_ALLOW_PUSH
  TASK_DEVSECOPS_RELEASE_PUSH_TOKEN: $TASK_COMMITIZEN_TOKEN
  TASK_DEVSECOPS_RELEASE_GITLAB_API_URL: $CI_API_V4_URL
  TASK_DEVSECOPS_RELEASE_GIT_SERVER_HOST: $CI_SERVER_HOST
  TASK_DEVSECOPS_RELEASE_PROJECT_PATH: $CI_PROJECT_PATH

# Only jobs extending .docker-job inherit the Docker endpoint and credentials.
.docker-variables:
  variables:
    # When using dind service, you must instruct Docker to talk with
    # the daemon started inside of the service. The daemon is available
    # with a network connection instead of the default
    # /var/run/docker.sock socket.
    DOCKER_HOST: tcp://docker:2376
    #
    # The 'docker' hostname is the alias of the service container as described at
    # https://docs.gitlab.com/ee/ci/services/#accessing-the-services.
    # If you're using GitLab Runner 12.7 or earlier with the Kubernetes executor and Kubernetes 1.6 or earlier,
    # the variable must be set to tcp://localhost:2376 because of how the
    # Kubernetes executor connects services to the job container
    # DOCKER_HOST: tcp://localhost:2376
    #
    # Specify to Docker where to create the certificates. Docker
    # creates them automatically on boot, and creates
    # `/certs/client` to share between the service and job
    # container, thanks to volume mount from config.toml
    DOCKER_TLS_CERTDIR: "/certs"
    # These are usually specified by the entrypoint, however the
    # Kubernetes executor doesn't run entrypoints
    # https://gitlab.com/gitlab-org/gitlab-runner/-/issues/4125
    DOCKER_TLS_VERIFY: 1

    # Docker BuildKit settings
    DOCKER_BUILDKIT: "1" # Enable Docker BuildKit at the Docker engine level
    TASK_DOCKER_CE_BUILDKIT_ENABLED: "true" # Enable BuildKit in our Taskfile
    TASK_DOCKER_CE_BUILDKIT_CACHE_TYPE: "registry" # Use registry-based caching
    TASK_DOCKER_CE_AUTH_ENABLED: "true" # Enable registry authentication
    TASK_DOCKER_CE_PUSH: "true" # Enable pushing to registry including cache images

    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    DOCKER_DRIVER: overlay2
