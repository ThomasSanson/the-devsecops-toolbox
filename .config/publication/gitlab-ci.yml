---
# The jobs a project needs when it installed ONLY the source publication
# component (no root pipeline, no framework). Add one line to your
# .gitlab-ci.yml:
#
#   include:
#     - local: .config/publication/gitlab-ci.yml
#
# A project running the complete DevSecOps Toolbox needs none of this: there,
# `task release` runs the publication itself and the framework pipeline already
# carries the feedback job.
#
# Two stages are declared because the jobs answer to different phases: the
# publication belongs to RELEASE, Renovate to FEEDBACK. A pipeline that already
# declares its own `stages:` overrides this one — add both names to that list,
# or the jobs fail with "chosen stage does not exist".
#
# What to set, once, with `task publication:init`:
#   TASK_RENOVATE_TOKEN           created and stored for you, so Renovate can
#                                 open the merge request that brings the next
#                                 toolbox release in
# What to set by hand, as masked and protected CI/CD variables:
#   TASK_PUBLICATION_TOKEN        may push to the public repository
#   TASK_PUBLICATION_SOURCE_TOKEN may read this one's merge requests (or
#                                 GITLAB_TOKEN)
# Set TASK_PUBLICATION_ON as a CI/CD variable when GitLab must choose a manual
# job or tag-only rules. Do not set a default here: it would overwrite a
# project's versioned choice before the task can enforce it.

stages:
  - release
  - feedback

# Nothing becomes public before this job is green. It exports the exact files
# that would be published and scans them for secrets — the same check the code
# phase runs, on the set that actually leaves. It runs even when the publication
# is manual, so the answer is on screen before anyone clicks.
publication:scan:
  stage: release
  image:
    # The image's entrypoint IS betterleaks, and GitLab hands a job's script to
    # the entrypoint: left alone, the runner asks betterleaks to run "sh".
    name: ghcr.io/betterleaks/betterleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  before_script:
    # The runner's checkout and this container do not always agree on who owns
    # the directory, and git stops dead on that rather than reading a repository
    # it mistrusts.
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    # Everything in this framework runs through `task`, CI included. The image
    # is chosen for its scanner, not for its toolchain, so the task runner is
    # installed here at the version the project pins.
    - apk add --no-cache curl
    - sh .config/task/install.sh
  script:
    - task publication:scan
  # A tag pipeline scans the tag itself; everything else scans the default
  # branch, which is also what the publication defaults to when no ref is named.
  # It runs even when the publication is manual, so the answer is on screen
  # before anyone clicks.
  rules:
    - if: '$TASK_PUBLICATION_ON == "tag" && $CI_COMMIT_TAG'
      variables:
        TASK_PUBLICATION_SOURCE_REF: $CI_COMMIT_TAG
    - if: '$TASK_PUBLICATION_ON == "tag"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

publish-source:
  stage: release
  image:
    name: ghcr.io/betterleaks/betterleaks:latest
    entrypoint: [""]
  needs:
    - job: publication:scan
  variables:
    GIT_DEPTH: 0
    # A named source branch may move after the earlier job. The publication
    # therefore scans its own immutable snapshot before pushing it too.
  before_script:
    - apk add --no-cache git curl jq
    - sh .config/task/install.sh
  script:
    - task publication:publish
  rules:
    - if: '$TASK_PUBLICATION_ON == "manual" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - if: '$TASK_PUBLICATION_ON == "manual"'
      when: never
    - if: '$TASK_PUBLICATION_ON == "tag" && $CI_COMMIT_TAG'
      variables:
        TASK_PUBLICATION_SOURCE_REF: $CI_COMMIT_TAG
    - if: '$TASK_PUBLICATION_ON == "tag"'
      when: never
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

# Renovate reads .config/renovate/config.json, sees the toolbox release recorded
# in .config/devsecops/.copier-answers.yml, and opens the merge request that
# updates the component. It runs on the toolbox image because that is where
# `task` and copier already live.
feedback:
  stage: feedback
  image: registry.gitlab.com/digital-commons/devsecops/the-devsecops-toolbox:24.1.13
  variables:
    RENOVATE_TOKEN: $TASK_RENOVATE_TOKEN
    # The complete framework sets these three in its own CI variables file, which
    # a project that took one component does not have. Without them Renovate
    # runs against the repository named "." and finds nothing.
    TASK_RENOVATE_PLATFORM: gitlab
    TASK_RENOVATE_REPOSITORY: $CI_PROJECT_PATH
    TASK_RENOVATE_ENDPOINT: $CI_API_V4_URL
  before_script:
    # Renovate's copier manager applies the release by running `copier` itself,
    # so the binary has to be on PATH — the same line the complete framework's
    # feedback job runs, for the same reason. Without it the merge request
    # carries the version bump and none of the files it should have brought.
    - pipx install copier
  script:
    - task feedback
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
