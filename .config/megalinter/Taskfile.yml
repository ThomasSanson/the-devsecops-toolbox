---
version: "3"

vars:
  # Versioning (Source of truth from package.json)
  TASK_MEGALINTER_VERSION:
    sh: |
      grep '"mega-linter-runner":' .config/megalinter/package.json | sed -E 's/.*"mega-linter-runner": "([^"]+)".*/\1/'

  # Configuration
  TASK_MEGALINTER_ENABLED: '{{.TASK_MEGALINTER_ENABLED | default "true"}}'
  TASK_MEGALINTER_CONFIG: '{{.TASK_MEGALINTER_CONFIG | default ".config/megalinter/config.yml"}}'
  TASK_MEGALINTER_FLAVOR: '{{.TASK_MEGALINTER_FLAVOR | default ""}}'

  # Docker Advanced Settings
  TASK_MEGALINTER_CONTAINER_NAME: '{{.TASK_MEGALINTER_CONTAINER_NAME | default "megalinter-container"}}'
  # MegaLinter published its last Docker Hub image on 2026-02-28 (v9.4.0) and
  # moved to ghcr.io, which carries v9.5.0 and beyond. Left empty, every run
  # would ask Docker Hub for a tag that was never pushed there: "manifest
  # unknown", the whole lint job dead on the next version bump.
  TASK_MEGALINTER_IMAGE_PREFIX: '{{.TASK_MEGALINTER_IMAGE_PREFIX | default "ghcr.io/"}}'
  TASK_MEGALINTER_IMAGE: '{{.TASK_MEGALINTER_IMAGE_PREFIX | default "ghcr.io/"}}oxsecurity/megalinter{{if .TASK_MEGALINTER_FLAVOR}}-{{.TASK_MEGALINTER_FLAVOR}}{{end}}:v{{.TASK_MEGALINTER_VERSION}}'

  # Proxy forwarding (transparent: only set if proxy env vars exist)
  TASK_MEGALINTER_PROXY_DOCKER_ARGS:
    sh: |
      args=""
      [ -n "${HTTP_PROXY:-}" ] && args="$args -e HTTP_PROXY=$HTTP_PROXY"
      [ -n "${HTTPS_PROXY:-}" ] && args="$args -e HTTPS_PROXY=$HTTPS_PROXY"
      [ -n "${NO_PROXY:-}" ] && args="$args -e NO_PROXY=$NO_PROXY"
      [ -n "${http_proxy:-}" ] && args="$args -e http_proxy=$http_proxy"
      [ -n "${https_proxy:-}" ] && args="$args -e https_proxy=$https_proxy"
      [ -n "${no_proxy:-}" ] && args="$args -e no_proxy=$no_proxy"
      echo "$args"
  TASK_MEGALINTER_PROXY_NPX_ARGS:
    sh: |
      args=""
      [ -n "${HTTP_PROXY:-}" ] && args="$args --env HTTP_PROXY=${HTTP_PROXY}"
      [ -n "${HTTPS_PROXY:-}" ] && args="$args --env HTTPS_PROXY=${HTTPS_PROXY}"
      [ -n "${NO_PROXY:-}" ] && args="$args --env NO_PROXY=${NO_PROXY}"
      [ -n "${http_proxy:-}" ] && args="$args --env http_proxy=${http_proxy}"
      [ -n "${https_proxy:-}" ] && args="$args --env https_proxy=${https_proxy}"
      [ -n "${no_proxy:-}" ] && args="$args --env no_proxy=${no_proxy}"
      echo "$args"

tasks:
  default:
    desc: 🔍 Run MegaLinter (default method)
    cmds:
      - task: docker

  docker:
    desc: 🐳 Run MegaLinter for comprehensive code analysis
    summary: |
      ℹ️ Description:
        Runs MegaLinter in a Docker container for comprehensive code analysis.

      🔧 Variables:
        - TASK_MEGALINTER_VERSION: MegaLinter version
        - TASK_MEGALINTER_CONFIG: Path to config file
        - TASK_MEGALINTER_CONTAINER_NAME: Docker container name

      🔐 Preconditions:
        - Docker must be installed and running

      🔄 Execution:
        Runs MegaLinter in Docker, copies reports back to host
    status:
      - test "{{.TASK_MEGALINTER_ENABLED}}" = "false"
    preconditions:
      - sh: "command -v docker &> /dev/null"
        msg: "❌ Docker is not installed. Please run the 'docker-ce:install' task first."
    cmds:
      - cmd: echo "🔄 Running megalinter (v{{.TASK_MEGALINTER_VERSION}})..."
        silent: true
      - docker rm -f {{.TASK_MEGALINTER_CONTAINER_NAME}}
      - rm -rf ./megalinter-reports
      - defer: (docker cp {{.TASK_MEGALINTER_CONTAINER_NAME}}:/tmp/lint/megalinter-reports ./megalinter-reports && chown -R $(id -u):$(id -g) megalinter-reports) || true; docker rm -f {{.TASK_MEGALINTER_CONTAINER_NAME}}
      - docker run --rm -d --name {{.TASK_MEGALINTER_CONTAINER_NAME}} -e MEGALINTER_CONFIG='.config/megalinter/config.yml' {{.TASK_MEGALINTER_PROXY_DOCKER_ARGS}} -v /var/run/docker.sock:/var/run/docker.sock:rw --entrypoint sleep {{.TASK_MEGALINTER_IMAGE}} infinity
      - docker cp {{.USER_WORKING_DIR}} {{.TASK_MEGALINTER_CONTAINER_NAME}}:/tmp/lint
      - docker exec {{.TASK_MEGALINTER_CONTAINER_NAME}} /bin/bash /entrypoint.sh
      - cmd: echo "🎉 All files correctly linted with megalinter!"
        silent: true

  pnpm:dlx:
    desc: 📦 Run MegaLinter via pnpm dlx
    summary: |
      ℹ️ Description:
        Runs MegaLinter using pnpm dlx (alternative to npx).

      🔧 Variables:
        - TASK_MEGALINTER_VERSION: MegaLinter version
        - TASK_MEGALINTER_CONFIG: Path to config file

      🔄 Execution:
        Runs mega-linter-runner via pnpm dlx
    cmds:
      - cmd: echo "🔄 Running pnpm dlx megalinter (v{{.TASK_MEGALINTER_VERSION}})..."
        silent: true
      - MEGALINTER_CONFIG=.config/megalinter/config.yml pnpm dlx --package mega-linter-runner@{{.TASK_MEGALINTER_VERSION}} mega-linter-runner
      - cmd: echo "🎉 All files correctly linted with megalinter!"
        silent: true

  proxy:debug:
    desc: 🔍 Display resolved proxy arguments for debugging
    summary: |
      ℹ️ Description:
        Displays the proxy arguments that would be passed to MegaLinter Docker containers.
        Useful for verifying proxy configuration without running MegaLinter.

      🔄 Execution:
        Echoes resolved TASK_MEGALINTER_PROXY_DOCKER_ARGS and TASK_MEGALINTER_PROXY_NPX_ARGS
    cmds:
      - cmd: echo "DOCKER_PROXY_ARGS={{.TASK_MEGALINTER_PROXY_DOCKER_ARGS}}"
        silent: true
      - cmd: echo "NPX_PROXY_ARGS={{.TASK_MEGALINTER_PROXY_NPX_ARGS}}"
        silent: true

  npx:
    desc: 🚀 Run MegaLinter locally via npx
    summary: |
      ℹ️ Description:
        Runs MegaLinter locally via npx without requiring Docker daemon.

      🔧 Variables:
        - TASK_MEGALINTER_CONFIG: Path to config file
        - TASK_MEGALINTER_FLAVOR: Optional MegaLinter flavor (javascript, python, etc.)
        - TASK_MEGALINTER_VERSION: MegaLinter version

      🔄 Execution:
        Runs mega-linter-runner via npx with Docker backend

      📝 Example:
        task megalinter:npx TASK_MEGALINTER_FLAVOR=javascript
    status:
      - test "{{.TASK_MEGALINTER_ENABLED}}" = "false"
    cmds:
      - cmd: echo "🔄 Running MegaLinter via npx (v{{.TASK_MEGALINTER_VERSION}})"
        silent: true
      - defer: docker run --rm -v {{.USER_WORKING_DIR}}/megalinter-reports:/reports alpine chmod -R 777 /reports 2>/dev/null || true
      - cmd: >-
          npx -y -p mega-linter-runner@{{.TASK_MEGALINTER_VERSION}} mega-linter-runner
          --release v{{.TASK_MEGALINTER_VERSION}}
          --image {{.TASK_MEGALINTER_IMAGE}}
          --env 'MEGALINTER_CONFIG={{.TASK_MEGALINTER_CONFIG}}'
          {{if .TASK_MEGALINTER_FLAVOR}}--env 'MEGALINTER_FLAVOR={{.TASK_MEGALINTER_FLAVOR}}'{{end}}
          {{.TASK_MEGALINTER_PROXY_NPX_ARGS}}
          {{.CLI_ARGS}}
      - cmd: echo '🎉 MegaLinter (npx) analysis completed successfully.'
        silent: true
