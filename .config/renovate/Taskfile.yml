---
version: "3"

vars:
  TASK_RENOVATE_ENABLED: '{{.TASK_RENOVATE_ENABLED | default "true"}}'
  TASK_RENOVATE_CONFIG: '{{.TASK_RENOVATE_CONFIG | default ".config/renovate/config.json"}}'
  TASK_RENOVATE_REPOSITORY: '{{.TASK_RENOVATE_REPOSITORY | default "."}}'
  TASK_RENOVATE_LOG_LEVEL: '{{.TASK_RENOVATE_LOG_LEVEL | default "info"}}'
  TASK_RENOVATE_PLATFORM: '{{.TASK_RENOVATE_PLATFORM | default "local"}}'
  TASK_RENOVATE_ENDPOINT: '{{.TASK_RENOVATE_ENDPOINT | default ""}}'
  TASK_RENOVATE_CLI_OPTS: '{{.TASK_RENOVATE_CLI_OPTS | default ""}}'
  TASK_RENOVATE_DRY_RUN: '{{.TASK_RENOVATE_DRY_RUN | default "false"}}'
  TASK_RENOVATE_TOKEN: '{{.TASK_RENOVATE_TOKEN | default (env "RENOVATE_TOKEN")}}'

tasks:
  default:
    desc: 🔄 Run Renovate with configurable options
    summary: |
      ℹ️ Description:
        Runs Renovate to analyze and update project dependencies.

      🔧 Variables:
        - TASK_RENOVATE_CONFIG: Path to Renovate config file
        - TASK_RENOVATE_PLATFORM: Platform (local, github, gitlab)
        - TASK_RENOVATE_DRY_RUN: Enable dry-run mode (false, true, full, lookup, extract)
        - TASK_RENOVATE_TOKEN: Authentication token

      🔐 Preconditions:
        - Node.js/npm must be installed for npx

      🔄 Execution:
        Runs Renovate via npx with configured options
    deps: [check]
    status:
      - test "{{.TASK_RENOVATE_ENABLED}}" != "true"
    env:
      RENOVATE_TOKEN: "{{.TASK_RENOVATE_TOKEN}}"
    vars:
      TASK_RENOVATE_CMD:
        sh: |
          # Safer shell behaviour
          set -eu

          # Prefer an already-installed renovate (pinned, offline, deterministic
          # and fast); fall back to npx only when it is not on PATH. npx re-resolves
          # "latest" from the registry on every call, which is slow and flakes on
          # throttled egress.
          if command -v renovate >/dev/null 2>&1; then
            CMD="renovate"
          else
            CMD="npx --yes -p renovate renovate"
          fi

          # Append dry-run argument directly
          case "{{.TASK_RENOVATE_DRY_RUN}}" in
            ""|"false")
              : # no dry-run
              ;;
            "true"|"full")
              CMD="$CMD --dry-run=full"
              ;;
            "lookup"|"extract")
              CMD="$CMD --dry-run={{.TASK_RENOVATE_DRY_RUN}}"
              ;;
            *)
              CMD="$CMD --dry-run={{.TASK_RENOVATE_DRY_RUN}}"
              ;;
          esac

          # Append platform argument directly
          if [ -n "{{.TASK_RENOVATE_PLATFORM}}" ]; then
            CMD="$CMD --platform={{.TASK_RENOVATE_PLATFORM}}"
          fi

          # Append optional CLI options
          if [ -n "{{.TASK_RENOVATE_CLI_OPTS}}" ]; then
            CMD="$CMD {{.TASK_RENOVATE_CLI_OPTS}}"
          fi

          # Append repository only when not using local platform
          if [ "{{.TASK_RENOVATE_PLATFORM}}" != "local" ] && [ -n "{{.TASK_RENOVATE_REPOSITORY}}" ]; then
            CMD="$CMD {{.TASK_RENOVATE_REPOSITORY}}"
          fi

          # Append trailing CLI args (from the Task invocation)
          if [ -n "{{.CLI_ARGS}}" ]; then
            CMD="$CMD {{.CLI_ARGS}}"
          fi

          # Environment prefix (deterministic order)
          ENV_PREFIX="LOG_LEVEL=\"{{.TASK_RENOVATE_LOG_LEVEL}}\" RENOVATE_CONFIG_FILE=\"{{.TASK_RENOVATE_CONFIG}}\""
          if [ -n "{{.TASK_RENOVATE_ENDPOINT}}" ]; then
            ENV_PREFIX="RENOVATE_ENDPOINT=\"{{.TASK_RENOVATE_ENDPOINT}}\" $ENV_PREFIX"
          fi

          # Print the final single-line command
          echo "$ENV_PREFIX $CMD"
    cmds:
      - cmd: "{{.TASK_RENOVATE_CMD}}"

  check:
    desc: ✅ Verify Renovate is runnable (installed binary or npx)
    summary: |
      ℹ️ Description:
        Verifies Renovate can run: either an installed `renovate` binary
        (preferred) or Node.js/npm so it can be fetched via npx.

      🔐 Preconditions:
        - `renovate` on PATH, or `npx` available
    preconditions:
      - sh: command -v renovate >/dev/null 2>&1 || command -v npx >/dev/null 2>&1
        msg: "❌ Missing prerequisite: install renovate, or Node.js/npm for npx."

  validate:
    desc: 🔍 Validate the Renovate configuration file
    summary: |
      ℹ️ Description:
        Validates the Renovate configuration file using renovate-config-validator.

      🔧 Variables:
        - TASK_RENOVATE_CONFIG: Path to config file to validate
        - TASK_RENOVATE_LOG_LEVEL: Logging verbosity

      🔄 Execution:
        Runs renovate-config-validator via npx
    deps: [check]
    cmds:
      - cmd: 'LOG_LEVEL="{{.TASK_RENOVATE_LOG_LEVEL}}" npx --yes -p renovate renovate-config-validator "{{.TASK_RENOVATE_CONFIG}}"'

  dry-run:
    desc: 🧪 Local dry-run of Renovate with the provided configuration
    summary: |
      ℹ️ Description:
        Runs Renovate in local mode for testing without making changes.

      🔄 Execution:
        Calls default task with TASK_RENOVATE_PLATFORM=local
    cmds:
      - task: default
        vars:
          TASK_RENOVATE_PLATFORM: "local"
