---
version: "3"

vars:
  TASK_GLAB_ENABLED: '{{.TASK_GLAB_ENABLED | default "true"}}'
  TASK_GLAB_CONFIG_DIR: '{{.TASK_GLAB_CONFIG_DIR | default ".config/glab"}}'

tasks:
  default:
    desc: 🦊 Install glab (GitLab CLI) if not already installed
    deps:
      - install
    summary: |
      ℹ️ Description:
        Installs glab (GitLab CLI) for interacting with GitLab from the command line.

      🔧 Variables:
        - TASK_GLAB_ENABLED: Enable or disable glab tasks. Default: "true"
        - TASK_GLAB_CONFIG_DIR: Path to glab configuration directory. Default: ".config/glab"

      🔄 Execution:
        Runs the install task if glab is not already installed.

      📝 Note:
        This task is part of the CODE phase of DevSecOps.

  install:
    desc: 📦 Install glab (GitLab CLI)
    summary: |
      ℹ️ Description:
        Installs glab (GitLab CLI) using multiple fallback methods:
        1. Direct binary download from GitLab releases
        2. Homebrew (if available)
        3. Package manager (apt)

      🔄 Execution:
        Runs the install.sh script to install glab.

      📝 Note:
        Skips installation if glab is already installed.
        Use the update task to force reinstallation.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
      - command -v glab
    cmds:
      - cmd: echo "📦 Installing glab (GitLab CLI)..."
        silent: true
      - cmd: bash {{.TASK_GLAB_CONFIG_DIR}}/install.sh
        silent: false
      - cmd: echo "🎉 glab installation complete."
        silent: true

  update:
    desc: 🔄 Update glab to latest version
    summary: |
      ℹ️ Description:
        Forces reinstallation of glab to the latest version.

      🔄 Execution:
        Sets GLAB_FORCE_UPDATE=true and runs the install script.

      📝 Note:
        This will reinstall glab even if it's already installed.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: echo "🔄 Updating glab to latest version..."
        silent: true
      - cmd: GLAB_FORCE_UPDATE=true bash {{.TASK_GLAB_CONFIG_DIR}}/install.sh
        silent: false
      - cmd: echo "🎉 glab update complete."
        silent: true

  check-update:
    desc: 🔍 Check for glab updates
    summary: |
      ℹ️ Description:
        Compares the currently installed glab version with the latest available version.

      🔄 Execution:
        1. Displays current installed version
        2. Fetches and displays latest version from GitLab API

      📝 Note:
        Requires curl and internet access to check latest version.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    vars:
      GREEN: '\033[0;32m'
      YELLOW: '\033[1;33m'
      NC: '\033[0m' # No Color
    cmds:
      - cmd: echo "🔍 Checking for glab updates..."
        silent: true
      - cmd: |
          echo -e "{{.YELLOW}}Current version:{{.NC}}"
          glab --version 2>/dev/null || echo "glab not installed"
          echo ""
          echo -e "{{.YELLOW}}Latest version available:{{.NC}}"
          curl -s https://gitlab.com/api/v4/projects/34675721/releases | grep -o '"tag_name":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "Unable to fetch latest version"
        silent: false

  auth:
    desc: 🔐 Authenticate with GitLab
    summary: |
      ℹ️ Description:
        Starts the interactive GitLab authentication flow.

      🔄 Execution:
        Runs glab auth login to authenticate with GitLab.

      📝 Note:
        Requires glab to be installed.
        You will be prompted to select your GitLab instance and authentication method.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: echo "🔐 Starting GitLab authentication..."
        silent: true
      - cmd: glab auth login
        silent: false

  auth:status:
    desc: 🔑 Check GitLab authentication status
    summary: |
      ℹ️ Description:
        Displays the current GitLab authentication status.

      🔄 Execution:
        Runs glab auth status to show authenticated accounts.

      📝 Note:
        Useful to verify which GitLab instances you are authenticated to.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    vars:
      GREEN: '\033[0;32m'
      RED: '\033[0;31m'
      NC: '\033[0m' # No Color
    cmds:
      - cmd: echo "🔍 Checking GitLab authentication status..."
        silent: true
      - cmd: |
          if glab auth status 2>&1; then
            echo -e "{{.GREEN}}✅ GitLab authentication is configured.{{.NC}}"
          else
            echo -e "{{.RED}}❌ Not authenticated to GitLab.{{.NC}}"
            echo "Run 'task glab:auth' to authenticate."
          fi
        silent: false

  merge-method:
    desc: 🦊 Configure GitLab merge method to fast-forward
    summary: |
      ℹ️ Description:
        Configures the GitLab project merge method to fast-forward (ff).
        In CI on non-protected branches (MR), skips the check (GITLAB_TOKEN
        is a protected variable, only available on protected branches).
        On default branch (CI) or locally, applies/verifies the setting.

      🔄 Execution:
        - Local / CI default branch: PUT projects/:id merge_method=ff
        - CI MR branch: skip (GITLAB_TOKEN not available)
    vars:
      TASK_GIT_DEFAULT_BRANCH: '{{.TASK_GIT_DEFAULT_BRANCH | default "main"}}'
      TASK_GIT_IS_DEFAULT_BRANCH:
        sh: |
          if [ -n "${CI_COMMIT_BRANCH:-}" ]; then
            CURRENT_BRANCH="$CI_COMMIT_BRANCH"
          elif [ -n "${CI_COMMIT_REF_NAME:-}" ]; then
            CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
          elif git rev-parse --is-inside-work-tree &>/dev/null; then
            CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          else
            CURRENT_BRANCH="main"
          fi
          if [ "$CURRENT_BRANCH" = "{{.TASK_GIT_DEFAULT_BRANCH}}" ]; then echo true; else echo false; fi
      TASK_GLAB_IS_CI:
        sh: if [ -n "${CI:-}" ]; then echo true; else echo false; fi
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: |
          if [ "{{.TASK_GLAB_IS_CI}}" = "true" ] && [ "{{.TASK_GIT_IS_DEFAULT_BRANCH}}" = "false" ]; then
            echo "⏩ Skipping merge_method check (MR branch — GITLAB_TOKEN is protected)"
            echo "   This check will run on the default branch after merge."
          elif [ "{{.TASK_GLAB_IS_CI}}" = "true" ] && [ "{{.TASK_GIT_IS_DEFAULT_BRANCH}}" = "true" ]; then
            echo "🔍 Verifying merge_method on default branch..."
            CURRENT=$(glab api projects/:id 2>/dev/null | jq -r '.merge_method // empty')
            if [ "$CURRENT" = "ff" ]; then
              echo "✅ merge_method is already set to fast-forward"
            else
              echo ""
              if [ -z "$CURRENT" ]; then
                echo "❌ merge_method could not be retrieved"
              else
                echo "❌ merge_method is '$CURRENT', expected 'ff'"
              fi
              echo ""
              echo "ℹ️  A user with Maintainer (or higher) role must run locally:"
              echo ""
              echo "     task devsecops:init"
              echo ""
              echo "   This configures fast-forward merge for the project."
              exit 1
            fi
          else
            echo "🦊 Applying merge_method=ff..."
            glab api --method PUT projects/:id -f merge_method=ff
            echo "✅ GitLab merge method set to fast-forward"
          fi
