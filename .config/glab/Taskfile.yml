---
version: "3"

vars:
  TASK_GLAB_ENABLED: '{{.TASK_GLAB_ENABLED | default "true"}}'
  TASK_GLAB_CONFIG_DIR: '{{.TASK_GLAB_CONFIG_DIR | default ".config/glab"}}'
  # init delivers the framework via an init-framework-devsecops merge request by
  # default; set TASK_DEVSECOPS_INIT_DIRECT=true to apply directly instead.
  TASK_DEVSECOPS_INIT_DIRECT: '{{.TASK_DEVSECOPS_INIT_DIRECT | default "false"}}'
  TASK_DEVSECOPS_INIT_BRANCH: '{{.TASK_DEVSECOPS_INIT_BRANCH | default "init-framework-devsecops"}}'
  # devsecops:update delivers a toolbox release on its own branch, so a release
  # never lands on the default branch without a review.
  TASK_DEVSECOPS_UPDATE_BRANCH: '{{.TASK_DEVSECOPS_UPDATE_BRANCH | default "update-framework-devsecops"}}'
  TASK_COPIER_ANSWER_FILE: '{{.TASK_COPIER_ANSWER_FILE | default ".config/devsecops/.copier-answers.yml"}}'

tasks:
  default:
    desc: 🦊 Install glab (GitLab CLI) if not already installed
    deps:
      - install
    summary: |
      ℹ️ Description:
        Installs glab (GitLab CLI) for interacting with GitLab from the command line.

      🔧 Variables:
        - TASK_GLAB_ENABLED: Enable or disable glab tasks. Default: "true"
        - TASK_GLAB_CONFIG_DIR: Path to glab configuration directory. Default: ".config/glab"

      🔄 Execution:
        Runs the install task if glab is not already installed.

      📝 Note:
        This task is part of the CODE phase of DevSecOps.

  install:
    desc: 📦 Install glab (GitLab CLI)
    summary: |
      ℹ️ Description:
        Installs glab (GitLab CLI) using multiple fallback methods:
        1. Direct binary download from GitLab releases
        2. Homebrew (if available)
        3. Package manager (apt)

      🔄 Execution:
        Runs the install.sh script to install glab.

      📝 Note:
        Skips installation if glab is already installed.
        Use the update task to force reinstallation.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
      - command -v glab
    cmds:
      - cmd: echo "📦 Installing glab (GitLab CLI)..."
        silent: true
      - cmd: bash {{.TASK_GLAB_CONFIG_DIR}}/install.sh
        silent: false
      - cmd: echo "🎉 glab installation complete."
        silent: true

  update:
    desc: 🔄 Update glab to latest version
    summary: |
      ℹ️ Description:
        Forces reinstallation of glab to the latest version.

      🔄 Execution:
        Sets GLAB_FORCE_UPDATE=true and runs the install script.

      📝 Note:
        This will reinstall glab even if it's already installed.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: echo "🔄 Updating glab to latest version..."
        silent: true
      - cmd: GLAB_FORCE_UPDATE=true bash {{.TASK_GLAB_CONFIG_DIR}}/install.sh
        silent: false
      - cmd: echo "🎉 glab update complete."
        silent: true

  check-update:
    desc: 🔍 Check for glab updates
    summary: |
      ℹ️ Description:
        Compares the currently installed glab version with the latest available version.

      🔄 Execution:
        1. Displays current installed version
        2. Fetches and displays latest version from GitLab API

      📝 Note:
        Requires curl and internet access to check latest version.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    vars:
      GREEN: '\033[0;32m'
      YELLOW: '\033[1;33m'
      NC: '\033[0m' # No Color
    cmds:
      - cmd: echo "🔍 Checking for glab updates..."
        silent: true
      - cmd: |
          echo -e "{{.YELLOW}}Current version:{{.NC}}"
          glab --version 2>/dev/null || echo "glab not installed"
          echo ""
          echo -e "{{.YELLOW}}Latest version available:{{.NC}}"
          curl -s https://gitlab.com/api/v4/projects/34675721/releases | grep -o '"tag_name":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "Unable to fetch latest version"
        silent: true

  auth:
    desc: 🔐 Authenticate with GitLab
    summary: |
      ℹ️ Description:
        Starts the interactive GitLab authentication flow.

      🔄 Execution:
        Runs glab auth login to authenticate with GitLab.

      📝 Note:
        Requires glab to be installed.
        You will be prompted to select your GitLab instance and authentication method.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: echo "🔐 Starting GitLab authentication..."
        silent: true
      - cmd: |
          detect_gitlab_host_from_remotes() {
            for remote_name in $(git remote 2>/dev/null); do
              remote_url="$(git remote get-url "$remote_name" 2>/dev/null || true)"
              [ -n "$remote_url" ] || continue

              remote_without_scheme="${remote_url#*://}"
              if [ "$remote_without_scheme" != "$remote_url" ]; then
                remote_url="$remote_without_scheme"
              fi

              remote_url="${remote_url#*@}"
              remote_host="${remote_url%%[:/]*}"
              case "$remote_host" in gitlabssh.*) remote_host="gitlab.${remote_host#gitlabssh.}" ;; esac

              if [ -n "$remote_host" ] && echo "$remote_host" | grep -qi "gitlab"; then
                echo "$remote_host"
                return 0
              fi
            done
            return 1
          }

          GITLAB_REMOTE_HOST="${GITLAB_HOST:-}"
          if [ -z "$GITLAB_REMOTE_HOST" ]; then
            GITLAB_REMOTE_HOST="$(detect_gitlab_host_from_remotes || true)"
          fi

          if [ -n "$GITLAB_REMOTE_HOST" ] && [ "$GITLAB_REMOTE_HOST" != "gitlab.com" ]; then
            echo "🔍 Detected GitLab host: $GITLAB_REMOTE_HOST"
            glab auth login --hostname "$GITLAB_REMOTE_HOST"
          else
            glab auth login
          fi
        silent: true

  auth:ensure:
    desc: 🔐 Ensure GitLab authentication is configured
    silent: true
    env:
      PATH:
        sh: "echo ${HOME}/.local/bin:${PATH}"
    cmds:
      - |
        set -eu

        # 1. Check required premium UI dependencies
        for tool in gum glow; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo
            echo "Required UI dependency missing: $tool"
            echo "Run:"
            echo "  task dev:setup-environment"
            echo "Then rerun:"
            echo "  task devsecops:init"
            echo
            exit 1
          fi
        done

        detect_gitlab_host_from_remotes() {
          for remote_name in $(git remote 2>/dev/null); do
            remote_url="$(git remote get-url "$remote_name" 2>/dev/null || true)"
            [ -n "$remote_url" ] || continue

            remote_without_scheme="${remote_url#*://}"
            if [ "$remote_without_scheme" != "$remote_url" ]; then
              remote_url="$remote_without_scheme"
            fi

            remote_url="${remote_url#*@}"
            remote_host="${remote_url%%[:/]*}"
            case "$remote_host" in gitlabssh.*) remote_host="gitlab.${remote_host#gitlabssh.}" ;; esac

            if [ -n "$remote_host" ] && echo "$remote_host" | grep -qi "gitlab"; then
              echo "$remote_host"
              return 0
            fi
          done
          return 1
        }

        host="${GITLAB_HOST:-}"
        if [ -z "$host" ]; then
          host="$(detect_gitlab_host_from_remotes || true)"
        fi

        # Remotes exist but none is a GitLab host (e.g. cloned from another
        # forge): authenticating cannot help — the remote itself must be
        # aligned first. Only fires when there ARE remotes to align, so
        # remote-less repos keep the generic auth flow below.
        if [ -z "$host" ] && [ -n "$(git remote 2>/dev/null || true)" ]; then
          echo "❌ No GitLab repository remote was detected."
          echo ""
          echo "Align your repository remote, then rerun:"
          echo "  git remote set-url origin https://gitlab.com/<namespace>/<project>.git"
          echo "  task devsecops:init"
          exit 1
        fi
        host="${host:-gitlab.example.com}"

        # 2. Check if gitlab CLI is available at all
        if ! command -v glab >/dev/null 2>&1; then
          echo
          gum style --foreground 212 --border normal --padding "1 2" --margin "1 0" "GitLab CLI not found"
          echo "  install     glab"
          echo "  then rerun  task devsecops:init"
          echo
          exit 1
        fi

        # 3. Check if already authenticated
        if glab auth status --hostname "$host" >/dev/null 2>&1 || glab auth status >/dev/null 2>&1; then
          echo
          gum style --foreground 212 "✅ GitLab authentication already configured for $host"
          gum style --foreground 240 "↻ Continuing initialization..."
          echo
          exit 0
        fi

        # 4. If CI or non-interactive
        if [ "${CI:-}" = "true" ] || [ ! -t 0 ]; then
          echo
          gum style --foreground 196 "❌ GitLab authentication required"
          echo "  host        $host"
          echo
          echo "  run locally task glab:auth"
          echo "  then rerun  task devsecops:init"
          echo
          exit 1
        fi

        # 5. Premium TTY Prompt
        echo "# 🔐 GitLab Authentication Required" > /tmp/glab_auth_card.md
        echo "" >> /tmp/glab_auth_card.md
        echo "This setup needs GitLab access before it can continue." >> /tmp/glab_auth_card.md
        echo "" >> /tmp/glab_auth_card.md
        echo "**Target Host:** \`$host\`" >> /tmp/glab_auth_card.md

        echo
        glow -s dark -w 80 /tmp/glab_auth_card.md
        rm -f /tmp/glab_auth_card.md
        echo

        if ! gum confirm "Continue and sign in now?" --default=true; then
          echo
          gum style --foreground 212 "⏸ Initialization paused"
          echo
          echo "  when ready  task glab:auth"
          echo "  then        task devsecops:init"
          echo
          exit 1
        fi

        task glab:auth

        if glab auth status --hostname "$host" >/dev/null 2>&1 || glab auth status >/dev/null 2>&1; then
          echo
          gum style --foreground 212 "✅ GitLab authentication successful"
          gum style --foreground 240 "↻ Resuming initialization..."
          echo
          exit 0
        fi

        echo
        gum style --foreground 196 "❌ GitLab authentication is still missing"
        echo
        echo "  retry with  task glab:auth"
        echo "  then        task devsecops:init"
        echo
        exit 1

  auth:status:
    desc: 🔑 Check GitLab authentication status
    summary: |
      ℹ️ Description:
        Displays the current GitLab authentication status.

      🔄 Execution:
        Runs glab auth status to show authenticated accounts.

      📝 Note:
        Useful to verify which GitLab instances you are authenticated to.
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    vars:
      GREEN: '\033[0;32m'
      RED: '\033[0;31m'
      NC: '\033[0m' # No Color
    cmds:
      - cmd: echo "🔍 Checking GitLab authentication status..."
        silent: true
      - cmd: |
          detect_gitlab_host_from_remotes() {
            for remote_name in $(git remote 2>/dev/null); do
              remote_url="$(git remote get-url "$remote_name" 2>/dev/null || true)"
              [ -n "$remote_url" ] || continue

              remote_without_scheme="${remote_url#*://}"
              if [ "$remote_without_scheme" != "$remote_url" ]; then
                remote_url="$remote_without_scheme"
              fi

              remote_url="${remote_url#*@}"
              remote_host="${remote_url%%[:/]*}"
              case "$remote_host" in gitlabssh.*) remote_host="gitlab.${remote_host#gitlabssh.}" ;; esac

              if [ -n "$remote_host" ] && echo "$remote_host" | grep -qi "gitlab"; then
                echo "$remote_host"
                return 0
              fi
            done
            return 1
          }

          GITLAB_REMOTE_HOST="${GITLAB_HOST:-}"
          if [ -z "$GITLAB_REMOTE_HOST" ]; then
            GITLAB_REMOTE_HOST="$(detect_gitlab_host_from_remotes || true)"
          fi

          if [ -n "$GITLAB_REMOTE_HOST" ]; then
            if glab auth status --hostname "$GITLAB_REMOTE_HOST" >/dev/null 2>&1; then
              echo -e "{{.GREEN}}✅ GitLab authentication is configured for host '$GITLAB_REMOTE_HOST'.{{.NC}}"
            else
              echo -e "{{.RED}}❌ GitLab authentication is not configured for host '$GITLAB_REMOTE_HOST'.{{.NC}}"
              echo ""
              echo "  👉 Run:  task glab:auth"
              echo ""
              exit 1
            fi
          elif glab auth status >/dev/null 2>&1; then
            echo -e "{{.GREEN}}✅ GitLab authentication is configured.{{.NC}}"
          else
            echo -e "{{.RED}}❌ Not authenticated to GitLab.{{.NC}}"
            echo ""
            echo "  👉 Run:  task glab:auth"
            echo ""
            exit 1
          fi
        silent: true

  merge-settings:
    desc: 🦊 Configure GitLab merge request settings
    summary: |
      ℹ️ Description:
        Configures GitLab merge request settings for the project.
        In CI on non-protected branches (MR), skips the check (GITLAB_TOKEN
        is a protected variable, only available on protected branches).
        On default branch (CI) or locally, applies/verifies the settings.

      🔧 Variables:
        - TASK_GLAB_MERGE_METHOD: Merge method (default: ff)
        - TASK_GLAB_SQUASH_OPTION: Squash option (default: default_off)
        - TASK_GLAB_REMOVE_SOURCE_BRANCH: Delete source branch after merge (default: true)
        - TASK_GLAB_PIPELINE_MUST_SUCCEED: Pipelines must succeed to merge (default: true)
        - TASK_GLAB_ALL_THREADS_RESOLVED: All threads must be resolved to merge (default: true)
        - TASK_GLAB_MR_LINK_ENABLED: Show MR link when pushing (default: true)

      🔄 Execution:
        - Local / CI default branch: PUT projects/:id with all settings
        - CI MR branch: skip (GITLAB_TOKEN not available)
    vars:
      TASK_GLAB_MERGE_METHOD: '{{.TASK_GLAB_MERGE_METHOD | default "ff"}}'
      TASK_GLAB_SQUASH_OPTION: '{{.TASK_GLAB_SQUASH_OPTION | default "default_off"}}'
      TASK_GLAB_REMOVE_SOURCE_BRANCH: '{{.TASK_GLAB_REMOVE_SOURCE_BRANCH | default "true"}}'
      TASK_GLAB_PIPELINE_MUST_SUCCEED: '{{.TASK_GLAB_PIPELINE_MUST_SUCCEED | default "true"}}'
      TASK_GLAB_ALL_THREADS_RESOLVED: '{{.TASK_GLAB_ALL_THREADS_RESOLVED | default "true"}}'
      TASK_GLAB_MR_LINK_ENABLED: '{{.TASK_GLAB_MR_LINK_ENABLED | default "true"}}'
      TASK_GIT_DEFAULT_BRANCH: '{{.TASK_GIT_DEFAULT_BRANCH | default "main"}}'
      TASK_GIT_IS_DEFAULT_BRANCH:
        sh: |
          if [ -n "${CI_COMMIT_BRANCH:-}" ]; then
            CURRENT_BRANCH="$CI_COMMIT_BRANCH"
          elif [ -n "${CI_COMMIT_REF_NAME:-}" ]; then
            CURRENT_BRANCH="$CI_COMMIT_REF_NAME"
          elif git rev-parse --is-inside-work-tree &>/dev/null; then
            CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || git symbolic-ref --short HEAD 2>/dev/null || echo main)"
          else
            CURRENT_BRANCH="main"
          fi
          if [ "$CURRENT_BRANCH" = "{{.TASK_GIT_DEFAULT_BRANCH}}" ]; then echo true; else echo false; fi
      TASK_GLAB_IS_CI:
        sh: if [ -n "${CI:-}" ]; then echo true; else echo false; fi
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: |
          if [ "{{.TASK_GLAB_IS_CI}}" = "true" ] && [ "{{.TASK_GIT_IS_DEFAULT_BRANCH}}" = "false" ]; then
            echo "⏩ Skipping merge request settings check (MR branch — GITLAB_TOKEN is protected)"
            echo "   This check will run on the default branch after merge."
          else
            detect_gitlab_host_from_remotes() {
              for remote_name in $(git remote 2>/dev/null); do
                remote_url="$(git remote get-url "$remote_name" 2>/dev/null || true)"
                [ -n "$remote_url" ] || continue

                remote_without_scheme="${remote_url#*://}"
                if [ "$remote_without_scheme" != "$remote_url" ]; then
                  remote_url="$remote_without_scheme"
                fi

                remote_url="${remote_url#*@}"
                remote_host="${remote_url%%[:/]*}"
                case "$remote_host" in gitlabssh.*) remote_host="gitlab.${remote_host#gitlabssh.}" ;; esac

                if [ -n "$remote_host" ] && echo "$remote_host" | grep -qi "gitlab"; then
                  echo "$remote_host"
                  return 0
                fi
              done
              return 1
            }

            GITLAB_REMOTE_HOST="${GITLAB_HOST:-}"
            if [ -z "$GITLAB_REMOTE_HOST" ]; then
              GITLAB_REMOTE_HOST="$(detect_gitlab_host_from_remotes || true)"
            fi

            if [ -z "$GITLAB_REMOTE_HOST" ]; then
              echo "❌ No GitLab repository remote was detected."
              echo ""
              echo "Align your repository remote, then rerun:"
              echo "  git remote set-url origin https://gitlab.com/<namespace>/<project>.git"
              echo "  task devsecops:init"
              exit 1
            fi

            if ! glab auth status --hostname "$GITLAB_REMOTE_HOST" >/dev/null 2>&1; then
              echo "❌ GitLab authentication required. Run 'task glab:auth:ensure'."
              exit 1
            fi

            PROJECT_PATH=$(git remote get-url origin 2>/dev/null)
            PROJECT_PATH="${PROJECT_PATH#*://*/}"
            PROJECT_PATH="${PROJECT_PATH#*:}"
            PROJECT_PATH="${PROJECT_PATH%.git}"
            PROJECT_PATH_ENCODED=$(printf "%s" "$PROJECT_PATH" | jq -sRr @uri)

            if [ "{{.TASK_GLAB_IS_CI}}" = "true" ] && [ "{{.TASK_GIT_IS_DEFAULT_BRANCH}}" = "true" ]; then
              echo "🔍 Verifying merge request settings on default branch..."
              PROJECT=$(glab api --hostname "$GITLAB_REMOTE_HOST" "projects/$PROJECT_PATH_ENCODED" 2>/dev/null)
              ERROR=0

              check_setting() {
                local field="$1" expected="$2" label="$3"
                local actual
                actual=$(echo "$PROJECT" | jq -r ".${field} // empty")
                if [ "$actual" = "$expected" ]; then
                  echo "  ✅ ${label} = ${actual}"
                else
                  echo "  ❌ ${label} is '${actual}', expected '${expected}'"
                  ERROR=1
                fi
              }

              check_setting "default_branch" "{{.TASK_GIT_DEFAULT_BRANCH}}" "default_branch"
              check_setting "merge_method" "{{.TASK_GLAB_MERGE_METHOD}}" "merge_method"
              check_setting "squash_option" "{{.TASK_GLAB_SQUASH_OPTION}}" "squash_option"
              check_setting "remove_source_branch_after_merge" "{{.TASK_GLAB_REMOVE_SOURCE_BRANCH}}" "remove_source_branch_after_merge"
              check_setting "only_allow_merge_if_pipeline_succeeds" "{{.TASK_GLAB_PIPELINE_MUST_SUCCEED}}" "only_allow_merge_if_pipeline_succeeds"
              check_setting "only_allow_merge_if_all_discussions_are_resolved" "{{.TASK_GLAB_ALL_THREADS_RESOLVED}}" "only_allow_merge_if_all_discussions_are_resolved"
              check_setting "printing_merge_request_link_enabled" "{{.TASK_GLAB_MR_LINK_ENABLED}}" "printing_merge_request_link_enabled"

              if [ "$ERROR" -eq 1 ]; then
                echo ""
                echo "ℹ️  A user with Maintainer (or higher) role must run locally:"
                echo ""
                echo "     task devsecops:init"
                echo ""
                echo "   This configures merge request settings for the project."
                exit 1
              fi
            else
              echo "🦊 Applying merge request settings..."
              glab api --method PUT "projects/$PROJECT_PATH_ENCODED" --hostname "$GITLAB_REMOTE_HOST" \
                -f default_branch={{.TASK_GIT_DEFAULT_BRANCH}} \
                -f merge_method={{.TASK_GLAB_MERGE_METHOD}} \
                -f squash_option={{.TASK_GLAB_SQUASH_OPTION}} \
                -f remove_source_branch_after_merge={{.TASK_GLAB_REMOVE_SOURCE_BRANCH}} \
                -f only_allow_merge_if_pipeline_succeeds={{.TASK_GLAB_PIPELINE_MUST_SUCCEED}} \
                -f only_allow_merge_if_all_discussions_are_resolved={{.TASK_GLAB_ALL_THREADS_RESOLVED}} \
                -f printing_merge_request_link_enabled={{.TASK_GLAB_MR_LINK_ENABLED}}
              echo "✅ GitLab merge request settings configured"
            fi
          fi

  renovate-token:
    desc: 🔑 Create or refresh a Project Access Token for Renovate
    summary: |
      ℹ️ Description:
        Manages a GitLab Project Access Token for Renovate.
        Creates the token if it doesn't exist, rotates it if the CI/CD
        variable is missing, and enforces Maintainer access level (access_level=40).
        The token is piped directly to CI/CD storage — never stored locally.

      🔧 Variables:
        - TASK_GLAB_RENOVATE_TOKEN_NAME: CI/CD variable name (default: TASK_RENOVATE_TOKEN)
        - TASK_GLAB_RENOVATE_TOKEN_PROTECTED: Whether variable is protected (default: true)
        - TASK_GLAB_RENOVATE_TOKEN_FORCE: Force token refresh (default: false)

      🔐 Preconditions:
        - glab must be installed and authenticated
        - jq must be installed
        - User must have Maintainer (or higher) role

      🔄 Execution:
        1. Check permissions (Maintainer required)
        2. Check existing tokens and their access_level
        3. Create, rotate, or recreate as needed
        4. Store token as CI/CD variable (masked, optionally protected)
    vars:
      TASK_GLAB_RENOVATE_TOKEN_NAME: '{{.TASK_GLAB_RENOVATE_TOKEN_NAME | default "TASK_RENOVATE_TOKEN"}}'
      TASK_GLAB_RENOVATE_TOKEN_PROTECTED: '{{.TASK_GLAB_RENOVATE_TOKEN_PROTECTED | default "true"}}'
      TASK_GLAB_RENOVATE_TOKEN_FORCE: '{{.TASK_GLAB_RENOVATE_TOKEN_FORCE | default "false"}}'
    preconditions:
      - sh: command -v glab >/dev/null 2>&1
        msg: "❌ glab is not installed. Run 'task glab:install' first."
      - sh: command -v jq >/dev/null 2>&1
        msg: "❌ jq is not installed."
      - sh: |
          detect_gitlab_host_from_remotes() {
            for remote_name in $(git remote 2>/dev/null); do
              remote_url="$(git remote get-url "$remote_name" 2>/dev/null || true)"
              [ -n "$remote_url" ] || continue

              remote_without_scheme="${remote_url#*://}"
              if [ "$remote_without_scheme" != "$remote_url" ]; then
                remote_url="$remote_without_scheme"
              fi

              remote_url="${remote_url#*@}"
              remote_host="${remote_url%%[:/]*}"
              case "$remote_host" in gitlabssh.*) remote_host="gitlab.${remote_host#gitlabssh.}" ;; esac

              if [ -n "$remote_host" ] && echo "$remote_host" | grep -qi "gitlab"; then
                echo "$remote_host"
                return 0
              fi
            done
            return 1
          }

          GITLAB_REMOTE_HOST="${GITLAB_HOST:-}"
          if [ -z "$GITLAB_REMOTE_HOST" ]; then
            GITLAB_REMOTE_HOST="$(detect_gitlab_host_from_remotes || true)"
          fi

          if [ -n "$GITLAB_REMOTE_HOST" ]; then
            glab auth status --hostname "$GITLAB_REMOTE_HOST" >/dev/null 2>&1 || [ -n "${GITLAB_TOKEN:-}" ]
          else
            glab auth status >/dev/null 2>&1 || [ -n "${GITLAB_TOKEN:-}" ]
          fi
        msg: "❌ Not authenticated to GitLab. Run 'task glab:auth' first."
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: |
          TASK_GLAB_RENOVATE_TOKEN_NAME="{{.TASK_GLAB_RENOVATE_TOKEN_NAME}}" \
          TASK_GLAB_RENOVATE_TOKEN_PROTECTED="{{.TASK_GLAB_RENOVATE_TOKEN_PROTECTED}}" \
          TASK_GLAB_RENOVATE_TOKEN_FORCE="{{.TASK_GLAB_RENOVATE_TOKEN_FORCE}}" \
          bash {{.TASK_GLAB_CONFIG_DIR}}/renovate-token.sh
        silent: true

  commitizen-token:
    desc: 🔑 Create or refresh a Project Access Token for Commitizen
    summary: |
      ℹ️ Description:
        Manages a GitLab Project Access Token dedicated to Commitizen releases.
        Creates the token if it doesn't exist, rotates it if the CI/CD
        variable is missing, and enforces Maintainer access level (access_level=40).
        The token is piped directly to CI/CD storage — never stored locally.

      🔧 Variables:
        - TASK_GLAB_COMMITIZEN_TOKEN_NAME: CI/CD variable name (default: TASK_COMMITIZEN_TOKEN)
        - TASK_GLAB_COMMITIZEN_TOKEN_PROTECTED: Whether variable is protected (default: true)
        - TASK_GLAB_COMMITIZEN_TOKEN_FORCE: Force token refresh (default: false)

      🔐 Preconditions:
        - glab must be installed and authenticated
        - jq must be installed
        - User must have Maintainer (or higher) role

      🔄 Execution:
        1. Check permissions (Maintainer required)
        2. Check existing tokens and their access_level
        3. Create, rotate, or recreate as needed
        4. Store token as CI/CD variable (masked, optionally protected)
    vars:
      TASK_GLAB_COMMITIZEN_TOKEN_NAME: '{{.TASK_GLAB_COMMITIZEN_TOKEN_NAME | default "TASK_COMMITIZEN_TOKEN"}}'
      TASK_GLAB_COMMITIZEN_TOKEN_PROTECTED: '{{.TASK_GLAB_COMMITIZEN_TOKEN_PROTECTED | default "true"}}'
      TASK_GLAB_COMMITIZEN_TOKEN_FORCE: '{{.TASK_GLAB_COMMITIZEN_TOKEN_FORCE | default "false"}}'
    preconditions:
      - sh: command -v glab >/dev/null 2>&1
        msg: "❌ glab is not installed. Run 'task glab:install' first."
      - sh: command -v jq >/dev/null 2>&1
        msg: "❌ jq is not installed."
      - sh: |
          detect_gitlab_host_from_remotes() {
            for remote_name in $(git remote 2>/dev/null); do
              remote_url="$(git remote get-url "$remote_name" 2>/dev/null || true)"
              [ -n "$remote_url" ] || continue

              remote_without_scheme="${remote_url#*://}"
              if [ "$remote_without_scheme" != "$remote_url" ]; then
                remote_url="$remote_without_scheme"
              fi

              remote_url="${remote_url#*@}"
              remote_host="${remote_url%%[:/]*}"
              case "$remote_host" in gitlabssh.*) remote_host="gitlab.${remote_host#gitlabssh.}" ;; esac

              if [ -n "$remote_host" ] && echo "$remote_host" | grep -qi "gitlab"; then
                echo "$remote_host"
                return 0
              fi
            done
            return 1
          }

          GITLAB_REMOTE_HOST="${GITLAB_HOST:-}"
          if [ -z "$GITLAB_REMOTE_HOST" ]; then
            GITLAB_REMOTE_HOST="$(detect_gitlab_host_from_remotes || true)"
          fi

          if [ -n "$GITLAB_REMOTE_HOST" ]; then
            glab auth status --hostname "$GITLAB_REMOTE_HOST" >/dev/null 2>&1 || [ -n "${GITLAB_TOKEN:-}" ]
          else
            glab auth status >/dev/null 2>&1 || [ -n "${GITLAB_TOKEN:-}" ]
          fi
        msg: "❌ Not authenticated to GitLab. Run 'task glab:auth' first."
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: |
          TASK_GLAB_COMMITIZEN_TOKEN_NAME="{{.TASK_GLAB_COMMITIZEN_TOKEN_NAME}}" \
          TASK_GLAB_COMMITIZEN_TOKEN_PROTECTED="{{.TASK_GLAB_COMMITIZEN_TOKEN_PROTECTED}}" \
          TASK_GLAB_COMMITIZEN_TOKEN_FORCE="{{.TASK_GLAB_COMMITIZEN_TOKEN_FORCE}}" \
          bash {{.TASK_GLAB_CONFIG_DIR}}/commitizen-token.sh
        silent: true

  protected-branch:
    desc: 🔒 Configure protected branch with strict rules
    summary: |
      ℹ️ Description:
        Configures the default branch with strict protection rules.
        Purges any stale access levels and sets:
        - Allowed to merge: Maintainers
        - Allowed to push: No one

      🔧 Variables:
        - TASK_GLAB_PROTECTED_BRANCH: Branch to protect (default: main)

      🔐 Preconditions:
        - glab must be installed and authenticated
        - jq must be installed
        - User must have Maintainer (or higher) role

      🔄 Execution:
        1. Check permissions (Maintainer required)
        2. Delete existing protection (purge stale rules)
        3. Re-create protection with strict rules
    vars:
      TASK_GLAB_PROTECTED_BRANCH: '{{.TASK_GLAB_PROTECTED_BRANCH | default "main"}}'
    preconditions:
      - sh: command -v glab >/dev/null 2>&1
        msg: "❌ glab is not installed. Run 'task glab:install' first."
      - sh: command -v jq >/dev/null 2>&1
        msg: "❌ jq is not installed."
      - sh: |
          detect_gitlab_host_from_remotes() {
            for remote_name in $(git remote 2>/dev/null); do
              remote_url="$(git remote get-url "$remote_name" 2>/dev/null || true)"
              [ -n "$remote_url" ] || continue

              remote_without_scheme="${remote_url#*://}"
              if [ "$remote_without_scheme" != "$remote_url" ]; then
                remote_url="$remote_without_scheme"
              fi

              remote_url="${remote_url#*@}"
              remote_host="${remote_url%%[:/]*}"
              case "$remote_host" in gitlabssh.*) remote_host="gitlab.${remote_host#gitlabssh.}" ;; esac

              if [ -n "$remote_host" ] && echo "$remote_host" | grep -qi "gitlab"; then
                echo "$remote_host"
                return 0
              fi
            done
            return 1
          }

          GITLAB_REMOTE_HOST="${GITLAB_HOST:-}"
          if [ -z "$GITLAB_REMOTE_HOST" ]; then
            GITLAB_REMOTE_HOST="$(detect_gitlab_host_from_remotes || true)"
          fi

          if [ -n "$GITLAB_REMOTE_HOST" ]; then
            glab auth status --hostname "$GITLAB_REMOTE_HOST" >/dev/null 2>&1 || [ -n "${GITLAB_TOKEN:-}" ]
          else
            glab auth status >/dev/null 2>&1 || [ -n "${GITLAB_TOKEN:-}" ]
          fi
        msg: "❌ Not authenticated to GitLab. Run 'task glab:auth' first."
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: |
          TASK_GLAB_PROTECTED_BRANCH="{{.TASK_GLAB_PROTECTED_BRANCH}}" \
          bash {{.TASK_GLAB_CONFIG_DIR}}/protected-branch.sh
        silent: true

  bootstrap-main:
    desc: 🌱 Ensure the default branch exists with an initial commit
    summary: |
      ℹ️ Description:
        Bootstraps the default branch with a minimal README + an initial
        conventional commit and pushes it, when the repository has no commits
        yet. The default branch stays clean — the framework is delivered via the
        init-framework-devsecops merge request afterwards.

        Idempotent: a no-op when the repository already has commits.
    vars:
      TASK_GIT_DEFAULT_BRANCH: '{{.TASK_GIT_DEFAULT_BRANCH | default "main"}}'
    preconditions:
      - sh: git remote get-url origin >/dev/null 2>&1
        msg: "❌ No 'origin' remote configured. Add a GitLab remote, then re-run."
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: |
          TASK_GIT_DEFAULT_BRANCH="{{.TASK_GIT_DEFAULT_BRANCH}}" \
          bash {{.TASK_GLAB_CONFIG_DIR}}/bootstrap-main.sh
        silent: true

  init-merge-request:
    desc: 🔀 Open the init-framework-devsecops merge request
    summary: |
      ℹ️ Description:
        Branches init-framework-devsecops from the default branch, commits the
        scaffolded framework, pushes, and opens a merge request (left open for
        review). This is the default init delivery; skipped when
        TASK_DEVSECOPS_INIT_DIRECT=true.

        Idempotent: re-uses the branch and does not open a duplicate MR.
    vars:
      TASK_GIT_DEFAULT_BRANCH: '{{.TASK_GIT_DEFAULT_BRANCH | default "main"}}'
      TASK_DEVSECOPS_INIT_BRANCH: '{{.TASK_DEVSECOPS_INIT_BRANCH | default "init-framework-devsecops"}}'
    preconditions:
      - sh: command -v glab >/dev/null 2>&1
        msg: "❌ glab is not installed. Run 'task glab:install' first."
      - sh: git remote get-url origin >/dev/null 2>&1
        msg: "❌ No 'origin' remote configured. Add a GitLab remote, then re-run."
    status:
      # Skip when GitLab is disabled OR direct mode is requested. Taskfile
      # `status` is AND across entries, so the OR must be a single command.
      - test "{{.TASK_GLAB_ENABLED}}" = "false" || test "{{.TASK_DEVSECOPS_INIT_DIRECT}}" = "true"
    cmds:
      - cmd: |
          TASK_GIT_DEFAULT_BRANCH="{{.TASK_GIT_DEFAULT_BRANCH}}" \
          TASK_DEVSECOPS_INIT_BRANCH="{{.TASK_DEVSECOPS_INIT_BRANCH}}" \
          bash {{.TASK_GLAB_CONFIG_DIR}}/init-merge-request.sh
        silent: true

  update-merge-request:
    desc: 🔀 Open the update-framework-devsecops merge request
    summary: |
      ℹ️ Description:
        Delivers a toolbox release the same way init delivers the framework:
        branches update-framework-devsecops from the default branch, commits
        what the update changed, pushes, and opens a merge request (left open
        for review). The release number comes from the answers file the update
        just rewrote, so it names itself.

        Run from a working branch instead, the change is committed there and no
        merge request is opened — a developer who updated from their own branch
        expects the change on it.

        Idempotent: re-uses the branch and does not open a duplicate MR.

      🔧 Variables:
        - TASK_DEVSECOPS_UPDATE_BRANCH: delivery branch (default: update-framework-devsecops)
        - TASK_COPIER_ANSWER_FILE: answers file naming the release (default: .config/devsecops/.copier-answers.yml)
    vars:
      TASK_GIT_DEFAULT_BRANCH: '{{.TASK_GIT_DEFAULT_BRANCH | default "main"}}'
    preconditions:
      - sh: command -v glab >/dev/null 2>&1
        msg: "❌ glab is not installed. Run 'task glab:install' first."
      - sh: git remote get-url origin >/dev/null 2>&1
        msg: "❌ No 'origin' remote configured. Add a GitLab remote, then re-run."
      - sh: test -f {{.TASK_COPIER_ANSWER_FILE}}
        msg: "❌ No answers file at {{.TASK_COPIER_ANSWER_FILE}} — this project was not generated from the toolbox."
    status:
      - test "{{.TASK_GLAB_ENABLED}}" = "false"
    cmds:
      - cmd: |
          release="$(sed -n 's/^_commit: *//p' {{.TASK_COPIER_ANSWER_FILE}} | tr -d '"')"
          TASK_GIT_DEFAULT_BRANCH="{{.TASK_GIT_DEFAULT_BRANCH}}" \
          bash {{.TASK_GLAB_CONFIG_DIR}}/init-merge-request.sh \
            "{{.TASK_DEVSECOPS_UPDATE_BRANCH}}" \
            "chore(deps): update devsecops toolbox to ${release}" \
            "Toolbox release ${release}, applied with the answers already stored in {{.TASK_COPIER_ANSWER_FILE}}. Review the diff and merge to adopt it." \
            "true"
        silent: true

  release:lock-default-branch:
    desc: 🔒 Lock default branch push access to No one for release safety
    summary: |
      ℹ️ Description:
        Enforces the strict protected-branch state for release safety:
        - Allowed to merge: Maintainers (40)
        - Allowed to push: No one (0)

      🔧 Variables:
        - TASK_DEVSECOPS_RELEASE_ALLOW_PUSH: Whether release push is allowed (default: true)
        - TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH: Current branch name
        - TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH: Default branch name (default: main)
        - TASK_DEVSECOPS_RELEASE_PUSH_TOKEN: GitLab API token (fallback: TASK_COMMITIZEN_TOKEN)
        - TASK_DEVSECOPS_RELEASE_GITLAB_API_URL: GitLab API v4 URL
        - TASK_DEVSECOPS_RELEASE_PROJECT_PATH: GitLab project path namespace/repo

      🔄 Execution:
        1. Skip if not in release push context
        2. Delete existing protected branch rule
        3. Re-create strict rule with push_access_level=0
    preconditions:
      - sh: command -v jq >/dev/null 2>&1
        msg: "❌ jq is not installed."
      - sh: test -n "{{.TASK_DEVSECOPS_RELEASE_PROJECT_PATH}}"
        msg: "PROJECT_PATH (TASK_DEVSECOPS_RELEASE_PROJECT_PATH) is not set. Set TASK_DEVSECOPS_RELEASE_PROJECT_PATH or CI_PROJECT_PATH env var."
      - sh: test -n "{{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}"
        msg: "CURRENT_BRANCH (TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH) is not set. Set TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH or ensure git setup is correct."
    vars:
      TASK_DEVSECOPS_RELEASE_ALLOW_PUSH: '{{.TASK_DEVSECOPS_RELEASE_ALLOW_PUSH | default "true"}}'
      TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH: '{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH | default "main"}}'
      TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH:
        sh: |
          if [ -n "${TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH:-}" ]; then
            echo "${TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}"
          elif git rev-parse --is-inside-work-tree &>/dev/null; then
            git config --global --add safe.directory "${PWD}"
            git rev-parse --abbrev-ref HEAD 2>/dev/null || git symbolic-ref --short HEAD 2>/dev/null || echo main
          else
            echo "main"
          fi
      TASK_DEVSECOPS_RELEASE_PUSH_TOKEN: '{{.TASK_DEVSECOPS_RELEASE_PUSH_TOKEN | default (env "TASK_COMMITIZEN_TOKEN")}}'
      TASK_DEVSECOPS_RELEASE_GITLAB_API_URL: '{{.TASK_DEVSECOPS_RELEASE_GITLAB_API_URL | default "https://gitlab.com/api/v4"}}'
      TASK_DEVSECOPS_RELEASE_PROJECT_PATH: '{{.TASK_DEVSECOPS_RELEASE_PROJECT_PATH | default "${PWD##*/}"}}'
    cmds:
      - cmd: |
          if [ "{{.TASK_DEVSECOPS_RELEASE_ALLOW_PUSH}}" != "true" ] || \
            [ "{{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}" != "{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}" ]; then
            echo "Skip: default branch lock not required for this context."
            exit 0
          fi

          require_var() {
            local value="$1"
            local label="$2"
            if [ -z "$value" ]; then
              echo "❌ Missing required variable: ${label}" >&2
              exit 1
            fi
          }

          TOKEN="${TASK_DEVSECOPS_RELEASE_PUSH_TOKEN:-}"
          API_URL="${TASK_DEVSECOPS_RELEASE_GITLAB_API_URL:-}"
          PROJECT_PATH="${TASK_DEVSECOPS_RELEASE_PROJECT_PATH:-}"
          BRANCH="${TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH:-{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}}"

          require_var "$TOKEN" "TASK_DEVSECOPS_RELEASE_PUSH_TOKEN (or TASK_COMMITIZEN_TOKEN)"
          require_var "$API_URL" "TASK_DEVSECOPS_RELEASE_GITLAB_API_URL"
          require_var "$PROJECT_PATH" "TASK_DEVSECOPS_RELEASE_PROJECT_PATH"

          PROJECT_PATH_ENCODED=$(printf '%s' "$PROJECT_PATH" | jq -sRr @uri)
          BRANCH_ENCODED=$(printf '%s' "$BRANCH" | jq -sRr @uri)

          curl --silent --show-error --fail \
            --request DELETE \
            --header "PRIVATE-TOKEN: ${TOKEN}" \
            "${API_URL}/projects/${PROJECT_PATH_ENCODED}/protected_branches/${BRANCH_ENCODED}" \
            >/dev/null 2>&1 || true

          curl --silent --show-error --fail \
            --request POST \
            --header "PRIVATE-TOKEN: ${TOKEN}" \
            "${API_URL}/projects/${PROJECT_PATH_ENCODED}/protected_branches?name=${BRANCH}&merge_access_level=40&push_access_level=0" \
            >/dev/null

          echo "✅ Default branch protection restored (push=No one)."
        silent: true
