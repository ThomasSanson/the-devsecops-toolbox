---
version: "3"

vars:
  TASK_DEVSECOPS_RELEASE_ENABLED: '{{.TASK_DEVSECOPS_RELEASE_ENABLED | default "true"}}'
  TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH: '{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH | default "main"}}'
  TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH:
    sh: |
      if [ -n "${TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH:-}" ]; then
        echo "${TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}"
      else
        # This var evaluates on EVERY task invocation: never write the global
        # gitconfig here. The previous unconditional `git config --global --add
        # safe.directory` appended one duplicate entry per run AND raced
        # concurrent invocations on ~/.gitconfig.lock (issue #158). Scope the
        # override to this evaluation via git's env interface instead — zero
        # writes, zero lock, and it also covers the very first invocation.
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="${PWD}"
        if git rev-parse --is-inside-work-tree &>/dev/null; then
          git rev-parse --abbrev-ref HEAD 2>/dev/null || git symbolic-ref --short HEAD 2>/dev/null || echo main
        else
          echo "main"
        fi
      fi
  TASK_DEVSECOPS_RELEASE_ALLOW_PUSH: '{{.TASK_DEVSECOPS_RELEASE_ALLOW_PUSH | default "true"}}'
  TASK_DEVSECOPS_RELEASE_PUSH_TOKEN: '{{.TASK_DEVSECOPS_RELEASE_PUSH_TOKEN | default (env "TASK_COMMITIZEN_TOKEN")}}'
  TASK_DEVSECOPS_RELEASE_GITLAB_API_URL: '{{.TASK_DEVSECOPS_RELEASE_GITLAB_API_URL | default "https://gitlab.com/api/v4"}}'
  TASK_DEVSECOPS_RELEASE_GIT_SERVER_HOST: '{{.TASK_DEVSECOPS_RELEASE_GIT_SERVER_HOST | default ""}}'
  TASK_DEVSECOPS_RELEASE_PROJECT_PATH: '{{.TASK_DEVSECOPS_RELEASE_PROJECT_PATH | default "${PWD##*/}"}}'

tasks:
  default:
    desc: Run all generic release tasks
    status:
      - test "{{.TASK_DEVSECOPS_RELEASE_ENABLED}}" = "false"
    cmds:
      - cmd: echo "🔄 Starting release phase"
        silent: true
      # The ORDER is the safety belt, and check-release-lock.sh freezes it: the
      # version is cut locally, the image for that version is published, and the
      # push comes LAST. Pushing is the one step that cannot be taken back —
      # done first, any later failure (a flaky download inside the image build
      # is enough) leaves a tag naming an image the registry does not have, the
      # default branch pointing at it, and no retry able to get past the tag.
      - task: push-release
      - task: :project:release
      - task: push
      - cmd: echo "🎉 Release phase completed successfully"
        silent: true

  commitizen:
    status:
      - test "{{.TASK_COMMITIZEN_ENABLED}}" = "false"
    cmds:
      - cmd: echo "🔄 Starting commitizen release bump"
        silent: true
      - task: :commitizen:bump
        vars:
          TASK_COMMITIZEN_BUMP_YES: "true"
          TASK_COMMITIZEN_BUMP_CHANGELOG:
            sh: |
              if [[ "{{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}" == "{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}" ]]; then
                echo "true"
                exit 0
              fi
              echo "false"
          TASK_COMMITIZEN_BUMP_DRY_RUN:
            sh: |
              if [[ "{{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}" == "{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}" ]]; then
                echo "false"
                exit 0
              fi
              echo "true"
      - cmd: echo "🎉 Commitizen release bump completed successfully"
        silent: true

  push-release:
    desc: Cut the release version locally. Pushes nothing.
    summary: |
      Commitizen writes the version bump, its changelog and its tag in the local
      clone, and that is all: the tag and the commit leave the machine in the
      `push` task, which runs once the image for that version is published.

      Everything that would make that push fail is checked HERE, before the
      bump, so a release that cannot be pushed never gets an image published in
      its name.
    preconditions:
      - sh: test -n "{{.TASK_DEVSECOPS_RELEASE_PROJECT_PATH}}"
        msg: "PROJECT_PATH (TASK_DEVSECOPS_RELEASE_PROJECT_PATH) is not set. Set TASK_DEVSECOPS_RELEASE_PROJECT_PATH or CI_PROJECT_PATH env var."
      - sh: test -n "{{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}"
        msg: "CURRENT_BRANCH (TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH) is not set. Set TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH or ensure git setup is correct."
    cmds:
      - cmd: echo "🔄 Starting release bump"
        silent: true
      - cmd: |
          echo "Current branch: {{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}"
          echo "Default branch: {{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}"

          if [ "{{.TASK_DEVSECOPS_RELEASE_ALLOW_PUSH}}" != "true" ] || \
            [ "{{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}" != "{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}" ]; then
            echo "Push window not required (ALLOW_PUSH disabled or not on default branch)."
            task devsecops:release:commitizen
            echo "Skip: no remote push performed."
            exit 0
          fi

          require_var() {
            local value="$1"
            local label="$2"
            if [ -z "$value" ]; then
              echo "❌ Missing required variable: ${label}" >&2
              exit 1
            fi
          }

          # Checked BEFORE the bump: a release that cannot be pushed must never
          # get an image published for a version nothing will ever tag.
          require_var "${TASK_DEVSECOPS_RELEASE_PUSH_TOKEN:-}" "TASK_DEVSECOPS_RELEASE_PUSH_TOKEN (or TASK_COMMITIZEN_TOKEN)"
          require_var "${TASK_DEVSECOPS_RELEASE_GITLAB_API_URL:-}" "TASK_DEVSECOPS_RELEASE_GITLAB_API_URL"
          require_var "${TASK_DEVSECOPS_RELEASE_GIT_SERVER_HOST:-}" "TASK_DEVSECOPS_RELEASE_GIT_SERVER_HOST"
          require_var "${TASK_DEVSECOPS_RELEASE_PROJECT_PATH:-}" "TASK_DEVSECOPS_RELEASE_PROJECT_PATH"

          echo "🧩 Running Commitizen..."
          task devsecops:release:commitizen
        silent: true
      - cmd: echo "🎉 Release version cut locally"
        silent: true

  push:
    desc: Push the version commit and its tag through a temporary push window.
    summary: |
      The last step of a release, and the only one that cannot be undone. It
      runs after the image for the new version is published, so the default
      branch never names an image the registry does not have.

      The default branch is protected: push access is opened for the seconds the
      push takes, and restored by an EXIT trap on every way out, a kill
      included (asserted by .config/devsecops/scripts/check-release-lock.sh).
    cmds:
      - cmd: echo "🔄 Starting release push"
        silent: true
      - cmd: |
          if [ "{{.TASK_DEVSECOPS_RELEASE_ALLOW_PUSH}}" != "true" ] || \
            [ "{{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}" != "{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}" ]; then
            echo "Skip: no remote push performed (ALLOW_PUSH disabled or not on default branch)."
            exit 0
          fi

          TOKEN="${TASK_DEVSECOPS_RELEASE_PUSH_TOKEN:-}"
          API_URL="${TASK_DEVSECOPS_RELEASE_GITLAB_API_URL:-}"
          HOST="${TASK_DEVSECOPS_RELEASE_GIT_SERVER_HOST:-}"
          PROJECT_PATH="${TASK_DEVSECOPS_RELEASE_PROJECT_PATH:-}"
          BRANCH="${TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH:-{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}}"

          REMOTE_PROTOCOL="https"
          if [ "${API_URL%%:*}" = "http" ]; then
            REMOTE_PROTOCOL="http"
          fi

          PROJECT_PATH_ENCODED=$(printf '%s' "$PROJECT_PATH" | jq -sRr @uri)
          BRANCH_ENCODED=$(printf '%s' "$BRANCH" | jq -sRr @uri)

          set_branch_protection() {
            local push_level="$1"
            curl --silent --show-error --fail \
              --request DELETE \
              --header "PRIVATE-TOKEN: ${TOKEN}" \
              "${API_URL}/projects/${PROJECT_PATH_ENCODED}/protected_branches/${BRANCH_ENCODED}" \
              >/dev/null 2>&1 || true

            curl --silent --show-error --fail \
              --request POST \
              --header "PRIVATE-TOKEN: ${TOKEN}" \
              "${API_URL}/projects/${PROJECT_PATH_ENCODED}/protected_branches?name=${BRANCH}&merge_access_level=40&push_access_level=${push_level}" \
              >/dev/null
          }

          restore_branch_protection() {
            echo "🔒 Restoring branch protection (push=No one)..."
            set +e
            task glab:release:lock-default-branch
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "❌ Failed to restore protected branch state (push=No one)." >&2
              exit "$status"
            fi
          }

          trap restore_branch_protection EXIT

          echo "🔓 Temporarily opening push access for Maintainers..."
          set_branch_protection 40

          echo "🔐 Configuring ${REMOTE_PROTOCOL^^} remote with Commitizen token..."
          git remote set-url origin "${REMOTE_PROTOCOL}://oauth2:${TOKEN}@${HOST}/${PROJECT_PATH}.git"

          # ONE push for both refs: a remote that refuses the connection, the
          # token or the branch leaves the default branch exactly as it was,
          # instead of a tag landing on its own with no commit behind it.
          echo "Pushing tags and the version commit to ${BRANCH}..."
          git push origin HEAD:"${BRANCH}" --tags
        silent: true
      - cmd: echo "🎉 Release push completed successfully"
        silent: true
