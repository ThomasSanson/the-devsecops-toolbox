---
!include .config/ansible/copier.yml
---
# Template configuration
_answers_file: .config/devsecops/.copier-answers.yml
_skip_if_exists:
  - iac/helm/Chart.yaml
  - VERSION
_min_copier_version: "9.3.0"

# Questions
ci_platform:
  type: str
  help: Which CI/CD platform are you using?
  choices:
    GitLab SaaS (gitlab.com): gitlab_saas
    GitLab Self-Hosted: gitlab_self_hosted
  default: gitlab_saas

devsecops_automerge:
  type: bool
  help: Enable automerge for DevSecOps Toolbox updates?
  default: true

proxy_enabled:
  type: bool
  help: Do you need to configure proxy settings for CI/CD jobs?
  default: false

http_proxy:
  type: str
  help: HTTP Proxy URL (e.g. http://proxy.example.com:8080)
  default: ""
  when: "{{ proxy_enabled }}"

https_proxy:
  type: str
  help: HTTPS Proxy URL (e.g. https://proxy.example.com:8443)
  default: ""
  when: "{{ proxy_enabled }}"

no_proxy:
  type: str
  help: NO_PROXY list (comma-separated)
  default: "localhost,127.0.0.1,docker,*.local"
  when: "{{ proxy_enabled }}"

project_enabled:
  type: bool
  help: Would you like to enable the project workspace (backend, frontend, data, auth, analytics, tests) to manage component-specific tasks?
  default: true

container_runtime:
  type: str
  help: Which container runtime would you like to use?
  choices:
    Docker: docker
    Podman: podman
  default: docker

use_docker_compose:
  type: bool
  help: Should we generate a standard docker-compose.yml file?
  default: true
  when: "{{ container_runtime == 'docker' }}"

project_slug:
  type: str
  default: "{{ _copier_conf.dst_path | basename | lower | replace(' ', '-') | replace('_', '-') }}"
  when: false

_exclude:
  - .agent/rules/code-style.md
  - .cache
  - .config/**/roles
  - .git
  - .vscode
  - CONTRIBUTING.md
  - copier.yml
  - megalinter-reports
  - node_modules
  - README.md
  - project/tests
  - tmp
  - venv
  - "{% if not project_enabled %}project{% endif %}"
  - "{% if container_runtime != 'docker' %}.config/docker-ce{% endif %}"
  - "{% if container_runtime != 'podman' %}.config/podman{% endif %}"
  - "{% if not use_docker_compose or container_runtime != 'docker' %}project/docker-compose.yml{% endif %}"

_message_after_copy: |
  Your DevSecOps project has been created successfully!

  Next steps:
  1. Review the generated configuration files
  2. Install the required dependencies:
    $ task dev:setup-environment
  3. Start using the DevSecOps pipeline with:
    $ task
