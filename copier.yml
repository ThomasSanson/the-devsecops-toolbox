---
!include .config/ansible/copier.yml
---
# Template configuration
_answers_file: .config/devsecops/.copier-answers.yml
_skip_if_exists:
  - iac/helm/Chart.yaml
  - VERSION
_min_copier_version: "9.3.0"

# Questions
ci_platform:
  type: str
  help: Which CI/CD platform are you using?
  choices:
    GitLab SaaS (gitlab.com): gitlab_saas
    GitLab Self-Hosted: gitlab_self_hosted
  default: gitlab_saas

gitlab_docker_host:
  type: str
  help: |
    Value for DOCKER_HOST variable.
    Leave empty to use the runner's default context (e.g. for shell executors or if DOCKER_HOST is injected).
  default: ""
  when: "{{ ci_platform == 'gitlab_self_hosted' }}"

gitlab_docker_tls_certdir:
  type: str
  help: |
    Value for DOCKER_TLS_CERTDIR variable.
    Set to "" (empty string) to disable TLS certificate generation.
    Default for SaaS is "/certs".
  default: ""
  when: "{{ ci_platform == 'gitlab_self_hosted' }}"

gitlab_docker_driver:
  type: str
  help: Value for DOCKER_DRIVER variable.
  default: overlay2
  when: "{{ ci_platform == 'gitlab_self_hosted' }}"

devsecops_automerge:
  type: bool
  help: Enable automerge for DevSecOps Toolbox updates?
  default: true

project_enabled:
  type: bool
  help: Would you like to enable the project workspace (backend, frontend, data, auth, analytics, tests) to manage component-specific tasks?
  default: true

container_runtime:
  type: str
  help: Which container runtime would you like to use?
  choices:
    Docker: docker
    Podman: podman
  default: docker

use_docker_compose:
  type: bool
  help: Should we generate a standard docker-compose.yml file?
  default: true
  when: "{{ container_runtime == 'docker' }}"

gherkin_language:
  type: str
  help: "Language for Gherkin test specifications (ISO 639-1 code: en, fr, de, es, ...)"
  default: en

project_slug:
  type: str
  default: "{{ _copier_conf.dst_path | realpath | basename | lower | replace(' ', '-') | replace('_', '-') }}"
  when: false

_exclude:
  - .agent/rules/code-style.md
  - .cache
  - .config/**/roles
  - .git
  - .vscode
  - CONTRIBUTING.md
  - copier.yml
  - megalinter-reports
  - node_modules
  - README.md
  - project/tests
  - tmp
  - venv
  - "{% if not project_enabled %}project{% endif %}"
  - "{% if container_runtime != 'docker' %}.config/docker-ce{% endif %}"
  - "{% if container_runtime != 'podman' %}.config/podman{% endif %}"
  - "{% if not use_docker_compose or container_runtime != 'docker' %}project/docker-compose.yml{% endif %}"

_message_after_copy: |
  Your DevSecOps project has been created successfully!

  Next steps:
  1. Set up your local environment:
    $ task dev:setup-environment

  2. Configure GitLab CI/CD variables (Settings > CI/CD > Variables):
    - CZ_DEPLOY_KEY  (type: File) — SSH deploy key for automated versioning
    - RENOVATE_TOKEN (type: Variable, protected) — GitLab API token for Renovate

  3. Customize your project:
    - Edit project/Taskfile.yml to add your project-specific tasks
    - Edit .env.dist for default configuration values
    - Edit .env.dev for local development overrides

  4. Start using the pipeline:
    $ task          # Show available tasks
    $ task code     # Run linters
    $ task test     # Run tests

  Documentation: docs/guidelines/
  AI agents: see AGENTS.md
