---
!include .config/ansible/copier.yml
---
# Template configuration
_answers_file: .config/devsecops/.copier-answers.yml
_skip_if_exists:
  - .config/cspell/config.project.json
  - VERSION
  - project/Taskfile.yml
  - project/docker-compose.yml
_min_copier_version: "9.3.0"

# cspell vocabulary migration (issue #162): when a project crosses into the
# version that split the cspell config, move any words it kept inline in the
# (now framework-owned) config.json into its project-owned config.project.json,
# so config.json stays the framework image and the words survive. before: MOVE
# the inline words out — copy them to config.project.json and empty the array
# they came from; after: drop the framework base words, leaving only the
# project's own. Idempotent afterwards.
_migrations:
  - version: "22.7.1"
    before:
      # Inlined (not the script): in the BEFORE phase the project still holds the
      # old version, which does not ship migrate-words.py yet.
      #
      # Emptying config.json's word list here is what keeps the update mergeable:
      # the release rewrites that same array, so a project that added a word to it
      # is editing the very lines the release replaces. Leave the word in place and
      # copier writes conflict markers into config.json, which stops being valid
      # JSON and takes cspell down with it (copier < 9.15.2 hid this: the conflict
      # landed in a gitignored .rej that copier then skipped — copier-org/copier#2668).
      # Emptied on both sides, the hunk merges clean and the word is already safe
      # in config.project.json.
      - >-
        python3 -c 'import json, pathlib, re;
        cfg = pathlib.Path(".config/cspell/config.json");
        text = cfg.read_text();
        legacy = json.loads(text).get("words") or [];
        ov = pathlib.Path(".config/cspell/config.project.json");
        cur = (json.loads(ov.read_text()).get("words") or []) if ov.exists() else [];
        ov.write_text(json.dumps({"version": "0.2", "words": sorted(set(cur + legacy))}, indent=2) + chr(10)) if legacy else None;
        cfg.write_text(re.sub("\"words\": \\[[^]]*\\]", "\"words\": []", text)) if legacy else None;
        print("[cspell migration] moving the project words out of the shared file") if legacy else None'
      # Copier reads the project from its Git INDEX (`git write-tree`) and, on a
      # rejected hunk, restores the file with `git checkout --`. An unstaged edit
      # is therefore invisible to the merge: stage it, or the line above is undone
      # before it can be of any use.
      - "git add -- .config/cspell/config.json"
    after:
      - "python3 .config/cspell/migrate-words.py dedup"

# Questions — CI/CD platform
ci_platform:
  type: str
  help: Which CI/CD platform are you using?
  choices:
    GitLab SaaS (gitlab.com): gitlab_saas
    GitLab Self-Hosted: gitlab_self_hosted
  default: gitlab_saas

gitlab_docker_host:
  type: str
  help: |
    DOCKER_HOST for your self-hosted runner (e.g. tcp://docker:2376).
    Leave empty to use the runner's default context (shell executor or injected DOCKER_HOST).
  default: ""
  when: "{{ ci_platform == 'gitlab_self_hosted' }}"

gitlab_docker_tls_certdir:
  type: str
  help: |
    DOCKER_TLS_CERTDIR for Docker-in-Docker with TLS on your self-hosted runner.
    Set to "" to disable TLS. GitLab SaaS uses "/certs" by default.
  default: ""
  when: "{{ ci_platform == 'gitlab_self_hosted' }}"

gitlab_docker_driver:
  type: str
  help: Storage driver for Docker-in-Docker on your self-hosted CI runners.
  default: overlay2
  when: "{{ ci_platform == 'gitlab_self_hosted' }}"

# Questions — Container runtime
container_runtime:
  type: str
  help: Which container runtime would you like to use?
  choices:
    Docker: docker
    Podman: podman
  default: docker

use_docker_compose:
  type: bool
  help: Generate a docker-compose.yml file in the project/ directory?
  default: true
  when: "{{ container_runtime == 'docker' }}"

# Questions — Project workspace
project_enabled:
  type: bool
  help: |
    Enable the project workspace? This generates project/Taskfile.yml for your
    custom tasks (build, test, deploy) and project/docker-compose.yml.
  default: true

# Questions — Maintenance
devsecops_automerge:
  type: bool
  help: |
    Auto-merge Renovate merge requests for DevSecOps Toolbox updates?
    When enabled, minor and patch updates are merged automatically.
  default: true

# Questions — Testing
gherkin_language:
  type: str
  help: "Language for Gherkin test specifications (ISO 639-1 code: en, fr, de, es, ...)"
  default: en

# Internal
project_slug:
  type: str
  default: "{{ _copier_conf.dst_path | realpath | basename | lower | replace(' ', '-') | replace('_', '-') }}"
  when: false

_exclude:
  - .agent/rules/code-style.md
  # Framework-repo marker: its presence tells agents they are in the toolbox
  # template itself. Excluded so generated projects keep the universal
  # AGENTS.md/CLAUDE.md without the template-only structure and constraints.
  - .agent/rules/framework-repo.md
  - .cache
  # CI sharding is a framework-suite concern: the shard map lives under the
  # excluded project/tests and the guard would have nothing to check downstream.
  - .config/devsecops/scripts/check-shard-coverage.sh
  - .config/**/roles
  - .git
  - .vscode
  - CONTRIBUTING.md
  - copier.yml
  - megalinter-reports
  - node_modules
  - README.md
  - project/gitlab
  - project/tests
  - project/ubuntu
  - tmp
  - venv
  - "{% if not project_enabled %}project{% endif %}"
  - "{% if container_runtime != 'docker' %}.config/docker-ce{% endif %}"
  - "{% if container_runtime != 'podman' %}.config/podman{% endif %}"
  - "{% if not use_docker_compose or container_runtime != 'docker' %}project/docker-compose.yml{% endif %}"

_tasks:
  - command: "sh .config/task/install.sh"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "task devsecops:init"
    when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |
  Your DevSecOps project has been created successfully!

  The project initialization (task devsecops:init) has been run automatically.
  If it failed or was skipped (missing --trust flag), you can run it manually:
    $ task devsecops:init
  If it reports missing prerequisites, run:
    $ task devsecops:init:prerequisites

  Next steps:
  1. Customize your project:
    - Edit project/Taskfile.yml to add your project-specific tasks
    - Edit .env.dist for default configuration values
    - Edit .env.dev for local development overrides

  2. Start using the pipeline:
    $ task          # Show available tasks
    $ task code     # Run linters
    $ task test     # Run tests

  Note: copier copy must be run with --trust to enable automatic initialization.

  Documentation: docs/guidelines/
  AI agents: see AGENTS.md
