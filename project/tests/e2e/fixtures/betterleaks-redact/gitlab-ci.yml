---
# Test project only: the generated merge-request pipeline cut down to its
# secret scan. The includes and the code:betterleaks job are the generated
# ones, unchanged. The story appends the generated `image:` line at publish time.
include:
  - local: .config/gitlab/ci/before_script.yml
  - local: .config/gitlab/ci/cache.yml
  - local: .config/gitlab/ci/services.yml
  - local: .config/gitlab/ci/stages.yml
  - local: .config/gitlab/ci/tags.yml
  - local: .config/gitlab/ci/variables.yml
  - local: .config/gitlab/ci/workflow.yml
  - local: .config/gitlab/ci/devsecops/code.yml

# Other checks are covered by their own stories.
code:project: &other_checks
  rules:
    - when: never
code:commitlint: *other_checks
code:commitizen-check: *other_checks
code:commitizen-bump-dry: *other_checks
code:lizard: *other_checks
code:renovate-validate: *other_checks
code:megalinter: *other_checks
code:all: *other_checks
