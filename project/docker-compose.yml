---
name: the-devsecops-toolbox

include:
  - gitlab/docker-compose.yml
  - ubuntu/docker-compose.yml
  - tests/docker-compose.yml

networks:
  the-devsecops-toolbox:
    driver_opts:
      # Match the smallest underlying MTU: GitLab.com hosted runners set the
      # outer Docker MTU to 1360 (see .config/gitlab/ci/services.yml).
      # Compose-created bridges otherwise default to 1500 inside dind,
      # silently dropping full-size packets from the test containers (the
      # gum/glab/go downloads inside scenario containers stalled on this).
      # Harmless on hosts whose MTU is larger.
      com.docker.network.driver.mtu: 1360
