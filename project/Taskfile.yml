---
version: "3"

vars:
  TASK_DOCKER_CE_IMAGE_NAME: "registry.gitlab.com/digital-commons/devsecops/the-devsecops-toolbox"
  TASK_DOCKER_CE_DOCKERFILE: ".config/devcontainer/ubuntu/Dockerfile"
  PROJECT_DOCKER_COMPOSE: "cd project && docker compose"

tasks:
  project:plan:
    desc: 🚀 Run project-specific plan tasks
    summary: |
      Orchestrates the plan phase.
      This task is intended to run Terraform plan, database migrations check, etc.
    cmds:
      - cmd: echo "🚀 Starting project plan phase"
        silent: true
      - cmd: echo "✅ Project Plan phase completed successfully"
        silent: true

  project:code:
    desc: 🚀 Run project-specific code tasks
    summary: |
      Orchestrates the code phase.
      This task runs linters, formatters, and static analysis tools.
    cmds:
      - cmd: echo "🚀 Starting project code phase"
        silent: true
      - cmd: echo "✅ Project Code phase completed successfully"
        silent: true

  project:build:
    desc: 🚀 Run project-specific build tasks
    summary: |
      Orchestrates the build phase.
      This task builds Docker images, compiles binaries, or packages artifacts.
    cmds:
      - cmd: echo "🚀 Starting project build phase"
        silent: true
      - task: docker-ce:build
        vars:
          TASK_DOCKER_CE_IMAGE_NAME: "{{.TASK_DOCKER_CE_IMAGE_NAME}}"
          TASK_DOCKER_CE_DOCKERFILE: "{{.TASK_DOCKER_CE_DOCKERFILE}}"
          TASK_DOCKER_CE_IMAGE_TAG:
            sh: |
              if [ -f "VERSION" ]; then
                echo $(cat VERSION)
              fi
      - cmd: echo "✅ Project Build phase completed successfully"
        silent: true

  project:build:gitlab:
    desc: Build tests component (gitlab)
    cmds:
      - "{{.PROJECT_DOCKER_COMPOSE}} build gitlab"

  project:build:tests:
    desc: Build tests component (codeceptjs)
    cmds:
      - "{{.PROJECT_DOCKER_COMPOSE}} build codeceptjs"

  project:build:ubuntu:
    desc: 🐳 Build Ubuntu test image
    cmds:
      - "{{.PROJECT_DOCKER_COMPOSE}} build ubuntu"

  project:test:
    desc: 🚀 Run project-specific test tasks
    summary: |
      Orchestrates the test phase.
      This task runs unit tests, integration tests, and TDD workflows.
    cmds:
      - cmd: echo "🚀 Starting project test phase"
        silent: true
      - task: project:test:clean
      - task: project:test:tdd
      - cmd: echo "✅ Project Test phase completed successfully"
        silent: true

  project:test:clean:
    desc: 🧹 Clean test temporary directory
    cmds:
      - rm -rf tmp/tests

  project:test:tdd:
    desc: 🚀 Run project-specific TDD test tasks
    summary: |
      Run tests in TDD mode.
      This task deploys necessary services and runs the unified E2E suite.
    cmds:
      - cmd: echo "🚀 Starting project TDD test phase"
        silent: true
      - task: deploy
      - task: project:test:e2e
      - cmd: echo "✅ Project TDD test phase completed successfully"
        silent: true

  project:test:e2e:
    desc: 🚀 Run unified E2E test suite
    summary: |
      Run the unified CodeceptJS E2E suite from project/tests/e2e/.
      This is the single entry point replacing the former bootstrap/, gitlab/
      and template/ suites. The runner executes inside the codeceptjs container
      so the Chromium font stack is identical on every machine (local / CI),
      and drives ttyd Ubuntu containers over the shared `the-devsecops-toolbox`
      docker network via the mounted docker socket. The same runner navigates
      the GitLab CE instance for init-effect verification.
    cmds:
      - defer: |
          {{if and (or .EXIT_CODE (eq .TASK_DIAGNOSTIC_FORCE "true")) (ne (env "CI") "")}}
            echo ""
            echo "🔍 =============================================="
            echo "🔍 DIAGNOSTIC COMPLET (defer)"
            {{if .EXIT_CODE}}
              echo "🔍 Exécuté suite à une erreur (exit code: {{.EXIT_CODE}})"
            {{else}}
              echo "🔍 Exécuté manuellement (TASK_DIAGNOSTIC_FORCE=true)"
            {{end}}
            echo "🔍 =============================================="
            ./project/tests/diagnostic-complet.sh || true
          {{end}}
      - cmd: echo "🚀 Starting project E2E test phase"
        silent: true
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} up -d codeceptjs --wait"
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} exec -T codeceptjs rm -rf /workspace"
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} exec -T codeceptjs mkdir -p /workspace"
      # .claude and .env are LOCAL-ONLY (agent tooling / personal overrides,
      # both gitignored): shipping them into /workspace makes Copier renders
      # differ between local and CI (the matrix `ls` baselines would embed
      # them) and could leak personal secrets into test containers.
      # .impeccable (editor plugin) and .ruff_cache (recreated every time ruff
      # lints migrate-words.py) are gitignored dev artifacts for the same reason.
      # .task is go-task's own runtime dir (checksums), recreated on every `task`
      # run — including this very run — so it is always present locally and would
      # otherwise land in every Copier render (the matrix `ls` tree baselines).
      - cmd: |
          tar \
            --exclude='.git' \
            --exclude='.cache' \
            --exclude='.claude' \
            --exclude='.impeccable' \
            --exclude='.ruff_cache' \
            --exclude='.task' \
            --exclude='.env' \
            --exclude='tmp' \
            --exclude='megalinter-reports' \
            --exclude='node_modules' \
            --exclude='project/tests/e2e/_output' \
            --exclude='project/tests/e2e/screenshots/diff' \
            -cf - . | \
            (cd project && docker compose exec -T codeceptjs tar -xf - -C /workspace)
      # Inline equivalent of `codeceptjs:docker` but using `run-workers <N>` so
      # scenarios execute in parallel. `codeceptjs:docker` hard-codes `run`
      # (single-process) and lives under `.config/` (read-only), so the parallel
      # variant is wired here. `--by pool` does dynamic load-balancing — ideal
      # when scenarios have very different durations (e.g. fast pilot vs slow
      # guidance scenarios). `--features` restricts to Gherkin .feature files.
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} exec -T codeceptjs rm -rf /app/project/tests"
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} exec -T codeceptjs mkdir -p /app/project/tests"
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} cp tests/. codeceptjs:/app/project/tests/"
      # Each cp runs in a subshell: PROJECT_DOCKER_COMPOSE starts with
      # `cd project &&`, which would break on the second invocation if the
      # first one had already changed the script's working directory.
      - defer: |
          echo "📥 Syncing artifacts (reports/screenshots) back to host..."
          ( {{.PROJECT_DOCKER_COMPOSE}} cp codeceptjs:/app/project/tests/e2e/_output tests/e2e/ ) \
            || echo "⚠️  WARNING: artifact sync failed — visual diffs and logs were NOT copied back to the host"
          ( {{.PROJECT_DOCKER_COMPOSE}} cp codeceptjs:/app/project/tests/e2e/screenshots tests/e2e/ ) \
            || echo "⚠️  WARNING: baseline sync failed — container-side screenshots were NOT copied back to the host"
          ( {{.PROJECT_DOCKER_COMPOSE}} cp codeceptjs:/app/project/tests/e2e/storyboards tests/e2e/ ) \
            || echo "⚠️  WARNING: storyboard sync failed — regenerated storyboard SVGs were NOT copied back to the host"
          # Failure storyboards carry a "Visual regression" band (green boards
          # never do): point the developer at them, LAST thing in the log.
          FAILED_BOARDS=$(grep -rl "Visual regression" project/tests/e2e/_output --include='*.svg' 2>/dev/null || true)
          if [ -n "$FAILED_BOARDS" ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════════"
            echo "🎬 ✖ Visual regression — open the failure storyboard in a browser:"
            for f in $FAILED_BOARDS; do echo "     $f"; done
            echo "   It sums everything up: expected / diff (changed pixels) / actual,"
            echo "   the exact sentence that broke, and the file paths to inspect."
            echo "════════════════════════════════════════════════════════════════"
          fi
      - cmd: >-
          {{.PROJECT_DOCKER_COMPOSE}} exec -T
          {{if .TASK_E2E_UPDATE_BASELINES}}-e TASK_E2E_UPDATE_BASELINES=1 {{end}}codeceptjs
          /usr/local/bin/codeceptjs run-workers
          {{.TASK_E2E_WORKERS | default "3"}}
          --features --by pool
          --config project/tests/e2e/codecept.conf.js
          {{if .TASK_CODECEPTJS_GREP}}--grep '{{.TASK_CODECEPTJS_GREP}}'{{end}}
          {{.CLI_ARGS}}
      - cmd: echo "✅ Project E2E test phase completed successfully"
        silent: true

  project:release:
    desc: 🚀 Run project-specific release tasks
    summary: |
      Orchestrates the release phase.
      This task tags images, packages releases, and updates versions.
    deps:
      - task: project:build
        vars:
          TASK_DOCKER_CE_IMAGE_TAG:
            sh: |
              if [ -f "VERSION" ]; then
                echo $(cat VERSION)
              fi
    cmds:
      - cmd: echo "🚀 Starting project release phase"
        silent: true
      - task: docker-ce:push
        vars:
          TASK_DOCKER_CE_PUSH:
            sh: |
              if [ "{{.TASK_DEVSECOPS_RELEASE_CURRENT_BRANCH}}" = "{{.TASK_DEVSECOPS_RELEASE_DEFAULT_BRANCH}}" ]; then
                echo true
              else
                echo false
              fi
          TASK_DOCKER_CE_IMAGE_TAG:
            sh: |
              if [ -f "VERSION" ]; then
                echo $(cat VERSION)
              fi
          TASK_DOCKER_CE_IMAGE_NAME: "{{.TASK_DOCKER_CE_IMAGE_NAME}}"
      - cmd: echo "✅ Project Release phase completed successfully"
        silent: true

  project:deploy:
    desc: 🚀 Run project-specific deploy tasks
    summary: |
      Orchestrates the deploy phase.
      This task deploys the application to the target environment.
    cmds:
      - cmd: echo "🚀 Starting project deploy phase"
        silent: true
      - task: project:deploy:gitlab
      - cmd: echo "✅ Project Deploy phase completed successfully"
        silent: true

  project:deploy:gitlab:
    desc: 🚀 Deploy GitLab CE test instance
    summary: |
      Start the local GitLab CE instance for testing.
      Uses the project docker-compose with the dev profile.
    cmds:
      - cmd: echo "🚀 Starting GitLab CE instance"
        silent: true
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} --profile dev up -d --force-recreate"
      - cmd: echo "✅ GitLab CE instance started (healthcheck may take ~5 min)"
        silent: true

  project:operate:
    desc: 🚀 Run project-specific operate tasks
    summary: |
      Orchestrates the operate phase.
      This task manages operational tasks like backups, scaling, etc.
    cmds:
      - cmd: echo "🚀 Starting project operate phase"
        silent: true
      - cmd: echo "✅ Project Operate phase completed successfully"
        silent: true

  project:operate:down:
    desc: 🛑 Stop all project containers (keep volumes)
    summary: |
      Stops and removes all project containers.
      Volumes and images are preserved.
    cmds:
      - cmd: echo "🛑 Stopping project containers"
        silent: true
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} --profile dev down"
      - cmd: echo "✅ Project containers stopped"
        silent: true

  project:operate:destroy:
    desc: 💥 Stop containers and remove volumes (images preserved)
    summary: |
      Stops and removes all project containers AND their volumes.
      Images are NOT removed. Use this to reset persistent data (e.g. GitLab DB).
    cmds:
      - cmd: echo "💥 Destroying project containers and volumes"
        silent: true
      - cmd: "{{.PROJECT_DOCKER_COMPOSE}} --profile dev down --volumes"
      - cmd: echo "✅ Project containers and volumes destroyed (images preserved)"
        silent: true

  project:monitor:
    desc: 🚀 Run project-specific monitor tasks
    summary: |
      Orchestrates the monitor phase.
      This task checks system health and metrics.
    cmds:
      - cmd: echo "🚀 Starting project monitor phase"
        silent: true
      - cmd: echo "✅ Project Monitor phase completed successfully"
        silent: true

  project:feedback:
    desc: 🚀 Run project-specific feedback tasks
    summary: |
      Orchestrates the feedback phase.
      This task gathers feedback metrics and reports.
    cmds:
      - cmd: echo "🚀 Starting project feedback phase"
        silent: true
      - cmd: echo "✅ Project Feedback phase completed successfully"
        silent: true
